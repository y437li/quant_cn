[project]
name = "quant-cn"
version = "0.1.0"
description = "A-share quant research on a local parquet + DuckDB lake fed by Tushare Pro"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "duckdb==1.5.5",
    "pandas>=2.2",
    "plotly>=6",
    "pyarrow>=17",
    "pydantic>=2.8",
    "python-dotenv>=1",
    "pyyaml>=6",
    "rich>=13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quant_cn"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "PL", "RUF", "D1"]
ignore = [
    "D105", # magic methods: documented by the class contract
    "D107", # __init__: documented by the class contract
    "PLR0913", # injected dependencies make constructors wide by design (CODING_STANDARD §2.3)
    "PLR0917", # same reason, positional form
]

[tool.ruff.lint.isort]
known-first-party = ["quant_cn", "tests"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D1", "PLR2004"]
"scripts/**" = ["T201"]

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "src"
files = ["src/quant_cn", "scripts"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*", "plotly", "plotly.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib -q"
pythonpath = ["."]

[tool.coverage.run]
source = ["quant_cn"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.importlinter]
root_package = "quant_cn"

[[tool.importlinter.contracts]]
name = "Layers (CODING_STANDARD §2.1)"
type = "layers"
layers = [
    "quant_cn.cli",
    "quant_cn.back_testing | quant_cn.portfolio | quant_cn.visualization",
    "quant_cn.pipeline | quant_cn.statistic",
    "quant_cn.data_loading",
    "quant_cn.lake",
    "quant_cn.core",
]

[dependency-groups]
dev = [
    "import-linter>=2.15",
    "ipykernel>=7.3.0",
    "mypy>=2.3.1",
    "nbclient>=0.11.0",
    "nbconvert>=7.17.1",
    "nbformat>=5.11.1",
    "pandas-stubs>=3.0.5.260914",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.9",
    "types-pyyaml>=6.0.12.20260906",
]
