<title>A股产业链图谱</title>

<style>
/* Layout: chain canvas on the left (upstream → downstream), a tabbed dossier on the right; stacks on phones. */
:root {
  --bg: #eef1f4; --panel: #ffffff; --ink: #172230; --muted: #5d6b7b; --line: #d5dce4; --soft: #e4e9ef;
  --company: #23395b; --product: #f7f9fb; --product-line: #8a9bb0; --material: #b9852f; --tech: #6d4fa3;
  --market: #2f7d63; --segment: #7c8794; --evidence: #1f6feb; --customer: #2f7d63; --supplier: #b9852f;
  --prior: #a7b2bf; --risk: #c4372d; --accent: #23395b;
  --display: "Noto Serif SC", "Songti SC", serif; --body: "Noto Sans SC", "PingFang SC", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #10151c; --panel: #171e27; --ink: #e3e9f0; --muted: #93a1b1; --line: #2c3743; --soft: #212a35;
  --company: #8fb0e0; --product: #1d2630; --product-line: #6b7d92; --material: #d9a64f; --tech: #a98ae0;
  --market: #5cc29c; --segment: #8d98a6; --evidence: #6aa6ff; --customer: #5cc29c; --supplier: #d9a64f;
  --prior: #4d5a68; --risk: #ef6b5f; --accent: #8fb0e0; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #10151c; --panel: #171e27; --ink: #e3e9f0; --muted: #93a1b1; --line: #2c3743; --soft: #212a35;
  --company: #8fb0e0; --product: #1d2630; --product-line: #6b7d92; --material: #d9a64f; --tech: #a98ae0;
  --market: #5cc29c; --segment: #8d98a6; --evidence: #6aa6ff; --customer: #5cc29c; --supplier: #d9a64f;
  --prior: #4d5a68; --risk: #ef6b5f; --accent: #8fb0e0; color-scheme: dark }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 14px; }
.app { height: 100%; display: grid; grid-template-rows: auto 1fr; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 12px; gap: 12px; box-sizing: border-box; }
header { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; }

.search { position: relative; flex: 1 1 260px; max-width: 420px; }
.search input { width: 100%; box-sizing: border-box; padding: 8px 12px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); color: var(--ink); font: inherit; }
.search input:focus-visible, button:focus-visible { outline: 2px solid var(--evidence); outline-offset: 1px; }
.results { position: absolute; z-index: 20; left: 0; right: 0; top: 100%; margin-top: 4px; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; max-height: 320px; overflow: auto; box-shadow: 0 8px 24px rgba(0,0,0,.12); }
.results button { display: flex; width: 100%; justify-content: space-between; gap: 8px; border: 0; background: none; color: var(--ink); padding: 7px 12px; text-align: left; font: inherit; cursor: pointer; }
.results button:hover, .results button.on { background: var(--soft); }

.sector { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 12px; }

.quick { display: flex; flex-wrap: wrap; gap: 6px; }

main { --dw: 440px; display: grid; grid-template-columns: minmax(0, 1fr) 8px var(--dw); gap: 4px; min-height: 0; }

.splitter:hover::after, .splitter.drag::after { background: var(--accent); }

.controls { position: absolute; z-index: 5; top: 10px; left: 10px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; background: color-mix(in srgb, var(--panel) 88%, transparent); padding: 6px 8px; border-radius: 6px; border: 1px solid var(--line); font-size: 12px; }

main.wide .dossier, main.wide .splitter { display: none; }

.controls select { font: inherit; background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 4px; padding: 2px 4px; }
.legend { position: absolute; z-index: 5; bottom: 10px; left: 10px; display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 11px; color: var(--muted); background: color-mix(in srgb, var(--panel) 88%, transparent); padding: 6px 8px; border-radius: 6px; border: 1px solid var(--line); max-width: calc(100% - 20px); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; }
.legend .ln { width: 18px; height: 0; border-top: 2px solid; border-radius: 0; vertical-align: 3px; }
.dossier { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; display: grid; grid-template-rows: auto auto 1fr; min-height: 0; overflow: hidden; }
.head { padding: 14px 16px 10px; border-bottom: 1px solid var(--line); }
.head .eyebrow { font-size: 11px; letter-spacing: .08em; color: var(--muted); text-transform: uppercase; }
.head h2 { font-family: var(--display); font-weight: 600; font-size: 20px; margin: 2px 0 4px; text-wrap: balance; }
.head .meta { color: var(--muted); font-size: 12px; display: flex; flex-wrap: wrap; gap: 4px 12px; }
.tabs { display: flex; gap: 2px; padding: 0 8px; border-bottom: 1px solid var(--line); overflow-x: auto; }
.tabs button { border: 0; background: none; color: var(--muted); font: inherit; padding: 9px 10px; cursor: pointer; border-bottom: 2px solid transparent; white-space: nowrap; }
.tabs button.on { color: var(--ink); border-bottom-color: var(--accent); font-weight: 500; }
.tabs .n { font-family: var(--mono); font-size: 11px; color: var(--muted); margin-left: 3px; }
.body { overflow: auto; padding: 12px 16px 20px; min-width: 0; }
.body h3 { font-size: 12px; letter-spacing: .06em; color: var(--muted); margin: 14px 0 6px; font-weight: 500; }
.body h3:first-child { margin-top: 2px; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { text-align: left; font-weight: 500; color: var(--muted); font-size: 12px; padding: 4px 6px; border-bottom: 1px solid var(--line); }
td { padding: 6px; border-bottom: 1px solid var(--soft); vertical-align: top; }
td.num, th.num { text-align: right; font-family: var(--mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
.bar { height: 6px; background: var(--soft); border-radius: 3px; overflow: hidden; margin-top: 4px; }
.bar > span { display: block; height: 100%; background: var(--accent); }
.bar.cust > span { background: var(--customer); } .bar.supp > span { background: var(--supplier); }
.link { border: 0; background: none; color: var(--evidence); padding: 0; font: inherit; cursor: pointer; text-align: left; }
.link:hover { text-decoration: underline; }
.tag { display: inline-block; font-size: 11px; padding: 1px 6px; border-radius: 3px; background: var(--soft); color: var(--muted); margin: 1px 2px 1px 0; white-space: nowrap; }
.tag.risk { background: color-mix(in srgb, var(--risk) 16%, transparent); color: var(--risk); }
.tag.ev { background: color-mix(in srgb, var(--evidence) 14%, transparent); color: var(--evidence); }
.tag.prior { border: 1px dashed var(--prior); background: none; }
.kpis { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.kpi { border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; }
.kpi b { display: block; font-family: var(--mono); font-size: 18px; font-weight: 500; }
.kpi span { font-size: 11px; color: var(--muted); }
.note { color: var(--muted); font-size: 12px; line-height: 1.6; }
.list { display: flex; flex-direction: column; gap: 2px; }
.row { display: flex; justify-content: space-between; gap: 8px; padding: 4px 0; border-bottom: 1px solid var(--soft); }
.empty { color: var(--muted); padding: 24px 0; text-align: center; }
@media (max-width: 860px) {
  .app { height: auto; }
  main { grid-template-columns: minmax(0, 1fr); }
  .splitter { display: none; }
  .stage { height: 62vh; }
  .dossier { max-height: none; }
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

<script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.28.1/cytoscape.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dagre/0.8.5/dagre.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/cytoscape-dagre@2.5.0/cytoscape-dagre.js"></script>
<script>
"use strict";
const TYPE_ZH = { company: "公司", product: "产品", service: "服务", material: "材料", technology: "技术", end_market: "终端市场", segment: "细分" };
const REL_ZH = { upstream_of: "上游", component_of: "部件", uses_material: "原料", used_in: "用于", enables: "技术支撑", serves: "服务于", substitute_for: "替代" };
const HOW_ZH = { manual: "人工映射", rule: "规则匹配", exact: "名称一致", contains: "名称包含", overlap: "名称相近（同行业）", part: "拆分匹配", sector: "按申万行业推断（低置信）", generic: "无法归类（其他 / 会计科目）", none: "未匹配" };
const IMP_ZH = { high: "进口依赖高", medium: "进口依赖中", low: "进口依赖低" };
let D, N = {}, OUT = {}, IN = {}, MAKERS = {}, C = {}, cy = null, sel = null, tab = null;
let SEGP = {}, GOUT = {}, GIN = {};  // segment → products; group-level flows (segment / material / market)
const groupOf = id => { const n = N[id]; if (!n) return null; return n.t === "product" ? n.s || id : id; };

const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const yi = v => v == null ? "—" : (v / 1e8).toLocaleString("zh-CN", { maximumFractionDigits: 2 }) + " 亿";
const pct = v => v == null ? "—" : Number(v).toFixed(2) + "%";
const css = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
const typeOf = n => n.t === "product" && n.k === "service" ? "service" : n.t;

// downstream flow: every chain edge becomes from → to with from upstream of to
function addFlow(from, to, rel) {
  (OUT[from] ||= []).push({ to, rel }); (IN[to] ||= []).push({ from, rel });
}
function index() {
  D.nodes.forEach(n => N[n.id] = n);
  for (const [s, r, o] of D.edges) {
    if (r === "uses_material") addFlow(o, s, r);
    else if (r === "part_of" || r === "substitute_for") continue;
    else addFlow(s, o, r);
  }
  D.nodes.forEach(n => { if (n.t === "product" && n.s) (SEGP[n.s] ||= []).push(n.id); });
  const bump = (m, a, b) => { (m[a] ||= {})[b] = (m[a][b] || 0) + 1; };
  for (const from in OUT) for (const e of OUT[from]) {
    const a = groupOf(from), b = groupOf(e.to);
    if (a && b && a !== b) { bump(GOUT, a, b); bump(GIN, b, a); }
  }
  D.companies.forEach(c => {
    C[c.code] = c; c.customers ||= { rows: [] }; c.suppliers ||= { rows: [] };
    c.vector = {};
    c.revenue.forEach(r => r.pids.forEach(p => {
      (MAKERS[p] ||= []).push({ code: c.code, pct: r.pct / r.pids.length, item: r.item, how: r.how });
      c.vector[p] = (c.vector[p] || 0) + r.pct / r.pids.length;
    }));
  });
}

// neighbourhood of a set of chain nodes, `depth` hops up and/or down, capped per hop
function walk(seeds, depth, dir, cap = 14) {
  const seen = new Map(seeds.map(s => [s, 0])), edges = [];
  let frontierUp = [...seeds], frontierDown = [...seeds];
  for (let d = 1; d <= depth; d++) {
    if (dir !== "down") {
      const next = [];
      for (const id of frontierUp) for (const e of (IN[id] || []).slice(0, cap)) {
        edges.push([e.from, id, e.rel]); if (!seen.has(e.from)) { seen.set(e.from, -d); next.push(e.from); }
      }
      frontierUp = next;
    }
    if (dir !== "up") {
      const next = [];
      for (const id of frontierDown) for (const e of (OUT[id] || []).slice(0, cap)) {
        edges.push([id, e.to, e.rel]); if (!seen.has(e.to)) { seen.set(e.to, d); next.push(e.to); }
      }
      frontierDown = next;
    }
  }
  return { nodes: seen, edges };
}

function peersOf(code) {
  const v = C[code].vector, out = [];
  for (const other of D.companies) {
    if (other.code === code) continue;
    const shared = Object.keys(v).filter(p => other.vector[p]);
    if (!shared.length) continue;
    let dot = 0, a = 0, b = 0;
    for (const p in v) a += v[p] ** 2;
    for (const p in other.vector) b += other.vector[p] ** 2;
    shared.forEach(p => dot += v[p] * other.vector[p]);
    out.push({ code: other.code, score: dot / Math.sqrt(a * b), shared });
  }
  return out.sort((x, y) => y.score - x.score);
}

function groupNode(id) {
  const n = N[id], sec = n.sec && D.sectors[n.sec] ? `\n${D.sectors[n.sec]}` : "";
  return { data: { id, label: n.t === "segment" ? n.n + sec : n.n, type: typeOf(n), imp: n.imp || "", focus: 0 } };
}
function chainNode(id, focus) {
  const n = N[id];
  return { data: { id, label: n.n, type: typeOf(n), imp: n.imp || "", focus: focus ? 1 : 0 } };
}

function graphFor() {
  const depth = +document.getElementById("depth").value, dir = document.getElementById("dir").value;
  const showCp = document.getElementById("showCp").checked;
  const els = [], ids = new Set();
  const add = el => { if (!ids.has(el.data.id)) { ids.add(el.data.id); els.push(el); } };
  const edge = (s, t, kind, label = "") => add({ data: { id: `${s}>${t}>${kind}`, source: s, target: t, kind, label } });
  if (sel.kind === "company") {
    // swim lanes: suppliers | upstream | own products | downstream | end markets | customers
    const c = C[sel.id], cid = "CO:" + c.code, lane = {};
    const put = (el, col, rank = 0) => { el.data.col = col; el.data.rank = rank; add(el); lane[el.data.id] ??= col; };
    const own = [];
    [...c.revenue].sort((a, x) => x.pct - a.pct).forEach(r => r.pids.forEach((p, i) => { if (!own.includes(p)) { own.push(p); put(chainNode(p, true), 2, r.pct - i); } }));
    put({ data: { id: cid, label: c.name, type: "company", focus: 1 } }, 2, 1e9);
    own.forEach(p => edge(cid, p, "produces", ""));
    c.revenue.forEach(r => r.pids.slice(0, 1).forEach(p => { const e = els.find(x => x.data.id === `${cid}>${p}>produces`); if (e) e.data.label = pct(r.pct); }));
    if (c.internal.length === 2 && c.eliminations.length) {
      const [a, b] = c.internal.map(item => (c.revenue.find(r => r.item === item) || {}).pids || []);
      const amount = Math.abs(c.eliminations.reduce((s, e) => s + e.sales, 0));
      if (a.length && b.length) edge(a[0], b[0], "internal", `内部 ${yi(amount)}`);
    }
    if (dir !== "down") {
      const w = walk(own, Math.max(1, depth - 1), "up", 6);
      w.nodes.forEach((d, id) => { if (d < 0 && !own.includes(id)) put(chainNode(id, false), 1, d); });
      w.edges.forEach(([s0, t, r]) => { if (ids.has(s0) && ids.has(t)) edge(s0, t, "prior", ""); });
    }
    if (dir !== "up") {
      const w = walk(own, depth, "down", 6);
      w.nodes.forEach((d, id) => { if (d > 0 && !own.includes(id)) put(chainNode(id, false), N[id].t === "end_market" ? 4 : 3, -d); });
      w.edges.forEach(([s0, t, r]) => { if (ids.has(s0) && ids.has(t)) edge(s0, t, "prior", ""); });
    }
    if (showCp) {
      // a counterparty sits in the lane of the stage it operates at: next to the product it makes when known
      const placeKnown = (r, side) => {
        const code = r.code || (r.inferred ? r.inferred.code : null), other = code && code !== c.code && C[code];
        const id = other ? "CO:" + code : `${side === "u" ? "SU" : "CU"}:${c.code}:${r.rank}`;
        const label = other ? `${other.name}\n${side === "u" ? "供应商" : "客户"}${r.rank} · ${pct(r.pct)}${r.inferred ? " · 推断" : r.group ? " · 子公司" : ""}` : (r.anon ? `${side === "u" ? "供应商" : "客户"}${r.rank}` : r.name) + `\n${pct(r.pct)}${r.anon ? " · 未识别" : ""}`;
        put({ data: { id, label, type: other ? "company" : "counterparty", focus: 0 } }, side === "u" ? 1 : 3, other ? 500 + r.pct : -500 + r.pct);
        const k = other && r.inferred ? "inferred" : side === "u" ? "buys" : "sells";
        if (side === "u") edge(id, cid, k, ""); else edge(cid, id, k, "");
        const llmStage = r.profile && r.profile.llm_stages && r.profile.llm_stages.find(x => x.id && N[x.id]);
        if (!other && r.profile && (llmStage || r.profile.stages.length)) {
          const st = llmStage ? llmStage.id : r.profile.stages[0].id;
          if (!ids.has(st)) put(chainNode(st, false), 3, 0);
          edge(id, st, "stage", "可能环节");
          els.find(x => x.data.id === id).data.label += r.profile.region === "不确定" ? "" : " · " + r.profile.region;
        }
        if (other) {   // tie the counterparty to its own product in that lane
          const theirs = other.revenue.flatMap(x => x.pids).filter(p => ids.has(p) || true).slice(0, 1);
          theirs.forEach(p => { if (!ids.has(p)) put(chainNode(p, false), side === "u" ? 1 : 3, 499 + r.pct); edge(id, p, "produces", ""); });
        }
      };
      c.suppliers.rows.forEach(r => placeKnown(r, "u"));
      c.customers.rows.forEach(r => placeKnown(r, "d"));
      c.named.slice(0, 12).forEach(r => { const listed = r.code && r.code !== c.code && C[r.code]; const id = listed ? "CO:" + r.code : "EXT:" + r.name; put({ data: { id, label: (listed ? C[r.code].name : r.name) + `\n点名客户${r.detail ? " · " + r.detail.slice(0, 6) : ""}`, type: listed ? "company" : "foreign" } }, 3, 400); edge(cid, id, "named", ""); });
      // downstream applications DeepSeek read in the filing (evidence, not prior)
      c.revenue.forEach(rv => (c.apps && c.apps[rv.item] || []).filter(a => a.node_id && N[a.node_id]).slice(0, 4).forEach(a => {
        put(chainNode(a.node_id, false), N[a.node_id].t === "end_market" ? 4 : 3, a.weight === "主要" ? 50 : 10);
        const from = rv.pids[0] && ids.has(rv.pids[0]) ? rv.pids[0] : cid;
        edge(from, a.node_id, "app", a.weight);
      }));
    }
    const titles = ["", "上游：原料 / 部件 + 供应商", "本公司及其产品", "下游：产品 + 客户", "终端市场", ""];
    titles.forEach((t, i) => { if (t && els.some(e => e.data.col === i && !e.data.source)) add({ data: { id: "LANE:" + i, label: t, type: "lane", col: i, rank: 2e9 } }); });
  } else if (sel.kind === "sector" && document.getElementById("net").checked) {
    const inSec = D.companies.filter(c => c.l1 === sel.id && c.links.length).sort((a, b) => b.links.length - a.links.length).slice(0, 90);
    const node = (code, focus) => add({ data: { id: "CO:" + code, label: C[code].name, type: focus ? "company" : "counterparty", focus: 0 } });
    inSec.forEach(c => node(c.code, true));
    const core = new Set(inSec.map(c => c.code)), deg = {};  // other companies: keep the 70 most connected
    inSec.forEach(c => c.links.forEach(([o]) => { if (C[o] && !core.has(o) && (showCp || C[o].l1 === sel.id)) deg[o] = (deg[o] || 0) + 1; }));
    const outside = new Set(Object.entries(deg).sort((a, b) => b[1] - a[1]).slice(0, 70).map(([o]) => o));
    inSec.forEach(c => c.links.forEach(([o, k, p]) => {
      if (!C[o] || o === c.code || !(core.has(o) || outside.has(o))) return;
      node(o, C[o].l1 === sel.id);
      const lab = p != null ? pct(p) : "";
      if (k === "c" || k === "C") edge("CO:" + c.code, "CO:" + o, k === "c" ? "sells" : "named", lab);
      else if (k === "s" || k === "S") edge("CO:" + o, "CO:" + c.code, "buys", lab);
      else edge("CO:" + c.code, "CO:" + o, "peer", k === "P" ? "竞争" : "合作");
    }));
  } else if (sel.kind === "sector") {
    const segs = D.nodes.filter(n => n.t === "segment" && n.sec === sel.id).map(n => n.id);
    segs.forEach(id => add({ data: { id, label: `${N[id].n}\n${(SEGP[id] || []).length} 项`, type: "segment", focus: 1 } }));
    const top = (m, id) => Object.entries(m[id] || {}).sort((a, b) => b[1] - a[1]).slice(0, depth + 2);
    segs.forEach(id => {
      if (dir !== "down") top(GIN, id).forEach(([g, k]) => { add(groupNode(g)); edge(g, id, "prior", String(k)); });
      if (dir !== "up") top(GOUT, id).forEach(([g, k]) => { add(groupNode(g)); edge(id, g, "prior", String(k)); });
    });
  } else if (N[sel.id].t === "segment") {
    const ps = (SEGP[sel.id] || []).slice(0, 60);
    ps.forEach(id => add(chainNode(id, true)));
    const w = walk(ps, 1, dir, 6);
    w.nodes.forEach((_, id) => add(chainNode(id, ps.includes(id))));
    w.edges.forEach(([s, t, r]) => edge(s, t, "prior", ""));
    ps.forEach(p => (MAKERS[p] || []).forEach(m => { const cid = "CO:" + m.code; add({ data: { id: cid, label: C[m.code].name, type: "company", focus: 0 } }); edge(cid, p, "produces", pct(m.pct)); }));
  } else {
    const w = walk([sel.id], depth, dir, 12);
    w.nodes.forEach((_, id) => add(chainNode(id, id === sel.id)));
    w.edges.forEach(([s, t, r]) => edge(s, t, "prior", REL_ZH[r] || ""));
    (MAKERS[sel.id] || []).forEach(m => { const cid = "CO:" + m.code; add({ data: { id: cid, label: C[m.code].name, type: "company", focus: 0 } }); edge(cid, sel.id, "produces", pct(m.pct)); });
  }
  return els;
}

function draw() {
  const els = graphFor();
  if (!cy) {
    cy = cytoscape({ container: document.getElementById("cy"), wheelSensitivity: .25, minZoom: .1, maxZoom: 4 });
    cy.on("tap", "node", e => {
      const id = e.target.id();
      if (id.startsWith("CO:")) select({ kind: "company", id: id.slice(3) });
      else if (N[id]) select({ kind: "node", id });
    });
  }
  cy.style(styles());
  cy.elements().remove();
  cy.add(els);
  if (sel.kind === "company") {
    const cols = {};
    cy.nodes().forEach(n => (cols[n.data("col")] ||= []).push(n));
    const width = cy.container().clientWidth, colW = Math.max(170, width / 4.2);
    Object.entries(cols).forEach(([col, list]) => {
      list.sort((a, b) => b.data("rank") - a.data("rank"));
      list.forEach((n, i) => n.position({ x: (+col - 1) * colW, y: i * 58 }));
    });
    cy.nodes("[type='lane']").forEach(n => n.position({ x: n.position("x"), y: -50 }));
    cy.layout({ name: "preset", fit: false }).run();
  } else if (sel.kind === "sector" && document.getElementById("net").checked) {
    cy.layout({ name: "cose", animate: false, nodeRepulsion: 9000, idealEdgeLength: 90, numIter: 1500 }).run();
  } else {
    cy.layout({ name: "dagre", rankDir: "LR", nodeSep: 14, rankSep: 70, edgeSep: 8, animate: false }).run();
  }
  cy.fit(undefined, 30);
}

      `<h3>${KIND_ZH[k]} · ${l.length}</h3><div class="list">${l.map(q => `<div class="row"><span>${esc(q.summary)}${q.value ? ` <span class="tag ev">${esc(q.value)} ${esc(q.unit || "")}</span>` : ""}${q.counterparty ? ` <span class="tag">${esc(q.counterparty)}</span>` : ""}</span><span class="tag" title="${esc(q.evidence.quote)}">${esc(q.period)} p${q.evidence.page}</span></div>`).join("")}</div>`).join("") +
      `<p class="note">DeepSeek 读 2026 年一季报、三季报的“其他提醒事项”和营收类变动原因；悬停页码看原文。</p>` : `<p class="empty">季报没有可读的经营信息（多数公司“其他提醒事项”为不适用）</p>`;
  } else if (tab === "chain") {
    const list = (arr, word) => arr.length ? `<div class="list">${arr.map(([id, d]) => `<div class="row"><span>${nodeLink(id)}</span><span class="tag prior">${word}${d}层</span></div>`).join("")}</div>` : `<p class="empty">无</p>`;
    b.innerHTML = `<h3>上游：原料、部件、技术</h3>${list(up, "上游")}<h3>下游：应用与终端市场</h3>${list(down, "下游")}<p class="note">这些链接是 Opus 写的产业链先验（虚线），不是该公司的交易证据。</p>`;
  } else {
    const keys = { chapter: "管理层讨论与分析", business: "主营业务", industry: "行业情况", competitiveness: "核心竞争力", revenue_mix: "营业收入构成", capacity: "产能 / 产销", costs_materials: "成本与原材料", counterparties: "前五名客户和供应商", competition: "竞争格局", risks: "风险" };
    b.innerHTML = `<h3>${esc(c.source)}：定位到的章节</h3><table><thead><tr><th>章节</th><th class="num">页码</th></tr></thead><tbody>` +
      Object.entries(c.sections).map(([k, [a, z]]) => `<tr><td>${keys[k] || k}</td><td class="num">${a}–${z}</td></tr>`).join("") +
      `</tbody></table><h3>证据等级</h3><div class="list"><div class="row"><span><span class="tag ev">年报表格</span> 前五名客户、供应商、主营构成</span><span>规则解析</span></div><div class="row"><span><span class="tag ev">年报正文</span> 点名客户</span><span>原型人工标注，正式版由 DeepSeek 抽取</span></div><div class="row"><span><span class="tag prior">先验</span> 产品之间的上下游</span><span>Opus 产业链骨架</span></div></div>`;
  }
}

function renderNode() {
  const n = N[sel.id], makers = MAKERS[sel.id] || [];
  const ups = (IN[sel.id] || []).map(e => [e.from, e.rel]), downs = (OUT[sel.id] || []).map(e => [e.to, e.rel]);
  const seg = n.s && N[n.s] ? N[n.s].n : null, parent = n.p && N[n.p] ? n.p : null;
  head(`<div class="eyebrow">${TYPE_ZH[typeOf(n)]}${n.sec && D.sectors[n.sec] ? " · 申万 " + esc(D.sectors[n.sec]) : ""}</div><h2>${esc(n.n)}</h2><div class="meta">${n.en ? `<span>${esc(n.en)}</span>` : ""}${seg ? `<span>细分：${esc(seg)}</span>` : ""}${n.imp ? `<span class="tag risk">${IMP_ZH[n.imp]}</span>` : ""}</div>`);
  const bv = D.broker_prod[sel.id], hasView = VIEWS && VIEWS.product[sel.id];
  setTabs([{ key: "up", label: "上游", n: ups.length }, { key: "down", label: "下游", n: downs.length }, { key: "makers", label: "生产公司", n: makers.length }, { key: "val", label: "估值与指标", n: bv ? bv.n : (hasView ? hasView.n_reports : 0) }, { key: "attr", label: "属性" }]);
  const b = document.getElementById("body");
  const rel = arr => arr.length ? `<div class="list">${arr.map(([id, r]) => `<div class="row"><span>${nodeLink(id)}</span><span class="tag prior">${REL_ZH[r] || r}</span></div>`).join("")}</div>` : `<p class="empty">骨架中没有记录</p>`;
  if (tab === "val" && !VIEWS) { b.innerHTML = `<p class="note">正在加载研报归纳…</p>`; loadViews().then(() => { if (sel.kind === "node" && tab === "val") renderNode(); }); return; }
  if (tab === "val") b.innerHTML = (VIEWS.product[sel.id] ? viewCard(VIEWS.product[sel.id], "该产品") : "") + (bv ? brokerLine(bv, "统计") + `<p class="note">来自生产该产品的公司的个股研报（最近 12 个月）。</p>` : (VIEWS.product[sel.id] ? "" : `<p class="empty">该产品研报样本不足（少于 3 篇）</p>`));
  else if (tab === "up") b.innerHTML = rel(ups);
  else if (tab === "down") b.innerHTML = rel(downs);
  else if (tab === "makers") b.innerHTML = makers.length ? `<table><thead><tr><th>公司</th><th>主营构成条目</th><th class="num">占其营收</th></tr></thead><tbody>${makers.map(m => `<tr><td>${companyLink(m.code)}</td><td>${esc(m.item)}</td><td class="num">${pct(m.pct)}</td></tr>`).join("")}</tbody></table><p class="note">按营收条目名称匹配，覆盖全部 A 股。</p>` : `<p class="empty">没有公司的营收条目匹配到该产品</p>`;
  else b.innerHTML = `<table><tbody><tr><td>编号</td><td>${esc(n.id)}</td></tr><tr><td>类型</td><td>${TYPE_ZH[typeOf(n)]}</td></tr>${parent ? `<tr><td>上级</td><td>${nodeLink(parent)}</td></tr>` : ""}${n.s ? `<tr><td>细分</td><td>${nodeLink(n.s)}</td></tr>` : ""}<tr><td>别名</td><td>${(n.al || []).map(a => `<span class="tag">${esc(a)}</span>`).join("") || "—"}</td></tr><tr><td>来源</td><td><span class="tag prior">产业链先验（Opus）</span></td></tr></tbody></table>`;
}

function groupList(m, id) {
  const rows = Object.entries(m[id] || {}).sort((a, b) => b[1] - a[1]);
  return rows.length ? `<div class="list">${rows.map(([g, k]) => `<div class="row"><span>${nodeLink(g)}${N[g].sec && D.sectors[N[g].sec] ? ` <span class="tag">${esc(D.sectors[N[g].sec])}</span>` : ""}</span><span class="tag prior">${k} 条关系</span></div>`).join("")}</div>` : `<p class="empty">无</p>`;
}
function renderSector() {
  const segs = D.nodes.filter(n => n.t === "segment" && n.sec === sel.id);
  const prods = segs.reduce((s, n) => s + (SEGP[n.id] || []).length, 0);
  const agg = m => { const out = {}; segs.forEach(sg => Object.entries(m[sg.id] || {}).forEach(([g, k]) => { if (N[g].sec !== sel.id) out[g] = (out[g] || 0) + k; })); return out; };
  const ups = agg(GIN), downs = agg(GOUT), cos = D.companies.filter(c => c.l1 === sel.id).sort((a, b) => b.links.length - a.links.length);
  head(`<div class="eyebrow">申万一级行业 · ${esc(sel.id)}</div><h2>${esc(D.sectors[sel.id])}</h2><div class="meta"><span>${segs.length} 个细分</span><span>${prods} 个产品 / 服务</span><span>产业链先验（Opus）</span></div>`);
  setTabs([{ key: "segs", label: "细分", n: segs.length }, { key: "up", label: "上游来自", n: Object.keys(ups).length }, { key: "down", label: "下游去向", n: Object.keys(downs).length }, { key: "cos", label: "公司", n: cos.length }]);
  const b = document.getElementById("body");
  const lst = m => { const rows = Object.entries(m).sort((a, x) => x[1] - a[1]); return rows.length ? `<div class="list">${rows.map(([g, k]) => `<div class="row"><span>${nodeLink(g)}${N[g].sec && D.sectors[N[g].sec] ? ` <span class="tag">${esc(D.sectors[N[g].sec])}</span>` : ""}</span><span class="tag prior">${k} 条</span></div>`).join("")}</div>` : `<p class="empty">无</p>`; };
  if (tab === "segs") b.innerHTML = `<div class="list">${segs.sort((a, x) => (SEGP[x.id] || []).length - (SEGP[a.id] || []).length).map(n => `<div class="row"><span>${nodeLink(n.id)}</span><span class="num">${(SEGP[n.id] || []).length} 项</span></div>`).join("")}</div><p class="note">图中每条线是细分之间产品级上下游关系的汇总，线上数字为关系条数。点击细分可展开其中的产品和服务。</p>`;
  else if (tab === "up") b.innerHTML = lst(ups) + `<p class="note">其他行业流入本行业的细分、材料和技术。</p>`;
  else if (tab === "down") b.innerHTML = lst(downs) + `<p class="note">本行业流向的其他行业细分和终端市场。</p>`;
  else b.innerHTML = cos.length ? `<div class="list">${cos.map(c => `<div class="row"><span>${companyLink(c.code)} <span class="tag">${esc(c.l3 || "")}</span></span><span class="tag ev">${c.links.length} 条关系</span></div>`).join("")}</div>` : `<p class="empty">无</p>`;
}
function renderSegment() {
  const n = N[sel.id], ps = SEGP[sel.id] || [];
  head(`<div class="eyebrow">细分${n.sec && D.sectors[n.sec] ? " · 申万 " + esc(D.sectors[n.sec]) : ""}</div><h2>${esc(n.n)}</h2><div class="meta">${n.en ? `<span>${esc(n.en)}</span>` : ""}<span>${ps.length} 个产品 / 服务</span>${n.sec ? `<button type="button" class="link" data-sector="${esc(n.sec)}">返回行业</button>` : ""}</div>`);
  setTabs([{ key: "prods", label: "产品与服务", n: ps.length }, { key: "up", label: "上游细分", n: Object.keys(GIN[sel.id] || {}).length }, { key: "down", label: "下游细分", n: Object.keys(GOUT[sel.id] || {}).length }]);
  const b = document.getElementById("body");
  if (tab === "prods") b.innerHTML = ps.length ? `<div class="list">${ps.map(p => `<div class="row"><span>${nodeLink(p)}</span><span>${MAKERS[p] ? `<span class="tag ev">${MAKERS[p].length} 家公司</span>` : ""}</span></div>`).join("")}</div>` : `<p class="empty">无</p>`;
  else if (tab === "up") b.innerHTML = groupList(GIN, sel.id);
  else b.innerHTML = groupList(GOUT, sel.id);
}
function renderDossier() {
  if (sel.kind === "company") renderCompany();
  else if (sel.kind === "sector") renderSector();
  else if (N[sel.id].t === "segment") renderSegment();
  else renderNode();
}
const SHARDS = {};
function loadDetail(code) {
  const c = C[code]; if (c.loaded) return Promise.resolve();
  const sec = c.l1 || "other";
  SHARDS[sec] ||= fetch(`co/${sec}.json`).then(r => { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); });
  return SHARDS[sec].then(all => { Object.assign(c, all[code] || {}); c.loaded = true; });
}
window.select = select;
async function select(s) {
  if (s.kind === "company" && !C[s.id]) return;
  if (s.kind === "company") {
    head(`<div class="eyebrow">公司 · ${esc(s.id)}</div><h2>${esc(C[s.id].name)}</h2><div class="meta">正在加载…</div>`);
    try { await loadDetail(s.id); } catch (err) { document.getElementById("body").innerHTML = `<p class="empty">公司详情没有加载出来：${esc(err.message)}。请重试。</p>`; return; }
  }
  sel = s; tab = null; draw(); renderDossier(); renderQuick();
  const ss = document.getElementById("sector"); if (ss) ss.value = s.kind === "sector" ? s.id : "";
}
document.addEventListener("click", e => {
  const n = e.target.closest("[data-node]"), co = e.target.closest("[data-co]");
  if (n && N[n.dataset.node]) select({ kind: "node", id: n.dataset.node });
  if (co) select({ kind: "company", id: co.dataset.co });
  const sc = e.target.closest("[data-sector]");
  if (sc) select({ kind: "sector", id: sc.dataset.sector });
});

// ---------- search ----------
function renderQuick() {
  document.getElementById("quick").innerHTML = D.quick.filter(code => C[code]).map(code => C[code]).map(c => `<button type="button" class="chip ${sel.kind === "company" && sel.id === c.code ? "on" : ""}" data-co="${c.code}">${esc(c.name)}</button>`).join("");
}
function setupSearch() {
  const q = document.getElementById("q"), res = document.getElementById("results");
  let hits = [], cur = 0;
  const show = () => {
    const s = q.value.trim().toLowerCase();
    if (!s) { res.hidden = true; return; }
    const cos = D.companies.filter(c => c.name.toLowerCase().includes(s) || c.code.toLowerCase().includes(s)).slice(0, 15).map(c => ({ kind: "company", id: c.code, label: c.name, sub: "公司 " + c.code }));
    const ns = D.nodes.filter(n => (String(n.n).toLowerCase().includes(s) || String(n.en || "").toLowerCase().includes(s) || (n.al || []).some(a => String(a).toLowerCase().includes(s))))
      .slice(0, 30).map(n => ({ kind: "node", id: n.id, label: n.n, sub: TYPE_ZH[typeOf(n)] + (MAKERS[n.id] ? ` · ${MAKERS[n.id].length} 家公司` : "") }));
    hits = [...cos, ...ns].slice(0, 30); cur = 0;
    res.innerHTML = hits.length ? hits.map((h, i) => `<button type="button" data-i="${i}" class="${i === 0 ? "on" : ""}"><span>${esc(h.label)}</span><span class="kind">${esc(h.sub)}</span></button>`).join("") : `<div class="empty">没有匹配项</div>`;
    res.hidden = false;
  };
  const pick = i => { const h = hits[i]; if (!h) return; res.hidden = true; q.value = ""; select({ kind: h.kind, id: h.id }); };
  q.addEventListener("input", show);
  q.addEventListener("keydown", e => {
    if (e.key === "ArrowDown" || e.key === "ArrowUp") { e.preventDefault(); cur = (cur + (e.key === "ArrowDown" ? 1 : -1) + hits.length) % Math.max(1, hits.length); [...res.children].forEach((b, i) => b.classList.toggle("on", i === cur)); }
    if (e.key === "Enter") pick(cur);
    if (e.key === "Escape") res.hidden = true;
  });
  res.addEventListener("click", e => { const b = e.target.closest("button[data-i]"); if (b) pick(+b.dataset.i); });
  document.addEventListener("click", e => { if (!e.target.closest(".search")) res.hidden = true; });
}

(function setupSplitter() {
  const main = document.querySelector("main"), bar = document.getElementById("splitter");
  const set = w => { main.style.setProperty("--dw", Math.round(Math.max(280, Math.min(w, main.clientWidth - 320))) + "px"); };
  try { const saved = +localStorage.getItem("chainViewDossierWidth"); if (saved) set(saved); } catch (e) {}
  let dragging = false;
  bar.addEventListener("pointerdown", e => { dragging = true; bar.classList.add("drag"); bar.setPointerCapture(e.pointerId); });
  bar.addEventListener("pointermove", e => { if (dragging) set(main.getBoundingClientRect().right - e.clientX); });
  const stop = () => {
    if (!dragging) return; dragging = false; bar.classList.remove("drag");
    try { localStorage.setItem("chainViewDossierWidth", parseInt(getComputedStyle(main).getPropertyValue("--dw"))); } catch (e) {}
    if (cy) cy.resize();
  };
  bar.addEventListener("pointerup", stop); bar.addEventListener("pointercancel", stop);
  bar.addEventListener("dblclick", () => { set(440); try { localStorage.removeItem("chainViewDossierWidth"); } catch (e) {} if (cy) cy.resize(); });
})();
const zoomBy = f => { if (!cy) return; cy.zoom({ level: cy.zoom() * f, renderedPosition: { x: cy.width() / 2, y: cy.height() / 2 } }); };
document.getElementById("zin").addEventListener("click", () => zoomBy(1.25));
document.getElementById("zout").addEventListener("click", () => zoomBy(0.8));
document.getElementById("zfit").addEventListener("click", () => cy && cy.fit(undefined, 30));
document.getElementById("wide").addEventListener("click", e => {
  const m = document.querySelector("main"); m.classList.toggle("wide");
  e.target.textContent = m.classList.contains("wide") ? "展开详情" : "收起详情";
  setTimeout(() => { if (cy) { cy.resize(); cy.fit(undefined, 30); } }, 50);
});
document.getElementById("full").addEventListener("click", () => {
  const st = document.querySelector(".stage");
  if (document.fullscreenElement) document.exitFullscreen(); else if (st.requestFullscreen) st.requestFullscreen();
});
document.addEventListener("fullscreenchange", () => {
  document.getElementById("full").textContent = document.fullscreenElement ? "退出全屏" : "全屏";
  setTimeout(() => { if (cy) { cy.resize(); cy.fit(undefined, 30); } }, 80);
});
["depth", "dir", "showCp", "net"].forEach(id => document.getElementById(id).addEventListener("change", () => draw()));
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => cy && cy.style(styles()));
new MutationObserver(() => cy && cy.style(styles())).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });

fetch("view_data.json").then(r => r.json()).then(data => {
  D = data; index(); legend(); setupSearch();
  const sectorSel = document.getElementById("sector");
  sectorSel.innerHTML += Object.entries(D.sectors).sort().map(([k, v]) => `<option value="${k}">${esc(v)}</option>`).join("");
  sectorSel.addEventListener("change", () => { if (sectorSel.value) select({ kind: "sector", id: sectorSel.value }); });
  const fromHash = () => { const m = location.hash.match(/co=([\w.]+)/); return m && C[m[1]] ? m[1] : null; };
  addEventListener("hashchange", () => { const code = fromHash(); if (code) select({ kind: "company", id: code }); });
  select({ kind: "company", id: fromHash() || "002714.SZ" }).catch(err => {
    document.getElementById("body").innerHTML = `<p class="empty">出错了：${esc(err.message)}</p>`;
  });
}).catch(err => {
  document.getElementById("body").innerHTML = `<p class="empty">数据没有加载出来：${esc(err.message)}。请刷新页面重试。</p>`;
});
</script>
