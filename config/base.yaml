# Committed defaults. Machine overrides: config/local.yaml (git-ignored). Secrets: .env only.
# Key meanings: config/README.md.

lake:
  root: ~/quant_cn_lake          # overridden by QUANT_CN_LAKE_ROOT (D-021); never inside the repo
  allow_inside_repo: false
  backup_target: null

tushare:
  url: http://api.tushare.pro
  timeout_s: 90
  page_size: 6000
  retries: 4
  retry_sleep_s: 6
  rate_limit_sleep_s: 65
  max_rate_limit_waits: 30
  rate_limit_markers: ["每分钟", "频率"]
  permission_markers: ["权限", "积分"]

llm:                             # extraction model (D-098); key from env DEEPSEEK_API_KEY only
  url: https://api.deepseek.com/chat/completions
  model: deepseek-flash
  timeout_s: 180
  retries: 3
  retry_sleep_s: 10
  min_interval_s: 0.2
  max_tokens: 8000
  thinking: false                # reasoning used 13k tokens on one report and truncated JSON at 6k
  # peak prices, CNY per 1M tokens (api-docs.deepseek.com pricing, 2026-11-07); off-peak = half
  prices:
    deepseek-flash: {input_hit: 0.04, input_miss: 2.0, output: 8.0}
    deepseek-v4-pro: {input_hit: 0.30, input_miss: 9.0, output: 27.0}
  peak_hours: [[9, 12], [14, 18]]  # Beijing time, Mon-Fri (holidays treated as peak: conservative)

