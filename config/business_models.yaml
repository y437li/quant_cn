# config/business_models.yaml — business-model archetypes and the Shenwan L3 → archetype default map (D-112)
#
# What: the 12 archetypes of plans/architecture/BUSINESS_MODEL_DESIGN.md §1 (revenue formula, driver roles,
# pricing, pass-through, profit hinge, cycle signals, moats, valuation methods, operating-mode variants) and a
# default archetype for every Shenwan 2021 L3 industry (sw_tree.csv, 346 codes).
# Status: Opus prior written from general knowledge of A-share companies, to be spot-checked by the user
# (BUSINESS_MODEL_DESIGN §4b.6). The L3 map is only a default: each company's segment gets archetype + variant
# from its own 经营模式 text and rule signals (D-112), which override it.
#
# Format
# archetypes:
#   A1:                                  # ids A1..A12
#     name / name_en / revenue_formula
#     drivers: [{role, description}]     # archetype-specific driver roles
#     pricing: market|spread|negotiated|bid|brand|regulated|contract
#     pass_through: full|lagged|partial|none
#     profit_hinge, cycle_signals [demand|margin|capex|commodity_price|inventory],
#     moat_types [cost|switching|intangible|network|efficient_scale], valuation_methods [PE, PB, ...]
#     variants: [{id, name, description, signals: [...]}]   # id snake_case, unique in the whole file
# sw_l3:
#   "110702":                            # L3 code (string), one entry per row of sw_tree.csv
#     archetype: A1                      # primary archetype
#     secondary: [A2]                    # optional, other archetypes common in the L3
#     drivers: {role: kpi_id | [kpi_id, ...]}   # ids from config/sector_kpis.yaml (L1 or group kpis that apply)
#     common_variants: [variant_id, ...] # optional, variant ids seen in the L3
#     note: "..."                        # optional, where the default is debatable
#
# A driver role must be a role of the primary or a secondary archetype, or one of the common roles that apply
# to every archetype: revenue, margin, overseas_share, rd_ratio, customer_concentration, receivables, capex,
# revenue_per_staff, contract_liabilities, market_share, inventory, capacity_growth, marketing_ratio.
# A role with no matching KPI is omitted; empty `drivers: {}` means no sector KPI fits yet.

archetypes:
  A1:
    name: 大宗商品生产
    name_en: Commodity producer
    revenue_formula: "volume × market_price"
    drivers:
      - {role: volume, description: "产量/销量 (头, 吨, 盎司, 桶)"}
      - {role: price, description: "实现售价, tracks a quoted market price"}
      - {role: unit_cost, description: "单位完全成本/现金成本 (完全成本, 吨煤成本, AISC)"}
      - {role: unit_margin, description: "单位毛利 (吨煤毛利, 吨毛利)"}
      - {role: capacity, description: "产能/存栏/核定产能/配额"}
      - {role: utilisation, description: "产能利用率"}
      - {role: reserves, description: "资源储量/可采储量"}
      - {role: self_sufficiency, description: "资源自给率"}
      - {role: mix, description: "长协 vs 现货, 产品结构"}
      - {role: efficiency, description: "生产效率 (PSY, 品位)"}
    pricing: market
    pass_through: none
    profit_hinge: "unit cost position on the industry cost curve versus the market price (完全成本 vs 价格)"
    cycle_signals: [commodity_price, capex, inventory, margin]
    moat_types: [cost, efficient_scale]
    valuation_methods: [PE, PB, EV_EBITDA, NAV, EV_per_capacity]
    variants:
      - id: integrated_farming
        name: 自繁自养一体化
        description: Own breeding, own farms and often own feed mills and slaughter; asset heavy, full control of cost.
        signals: ["经营模式 text mentions 自繁自养 or 全产业链一体化", "fixed assets / revenue > 1", "生产性生物资产 large on the balance sheet", "no 代养费 line in 营业成本构成"]
      - id: contract_farming
        name: 公司+农户 委托养殖
        description: Company supplies piglets/chicks, feed and vet services; contract farmers raise them for a fee; asset light.
        signals: ["经营模式 text mentions 公司+农户 or 合作农户 or 委托养殖", "代养费 / 委托养殖费 in 营业成本构成", "fixed assets / revenue < 0.6"]
      - id: feed_plus_farming
        name: 饲料+养殖
        description: Feed business funds and supplies an attached farming business; earnings mix spread (A2) and commodity (A1).
        signals: ["fina_mainbz has both 饲料 and 养殖 segments, each > 20% of revenue", "internal feed supply in elimination rows"]
      - id: breeding_stock_supplier
        name: 种源/苗种供应
        description: Sells breeding stock or young animals/seedlings (种猪, 祖代/父母代, 鸡苗, 苗种) rather than finished product.
        signals: ["main products are 种猪, 鸡苗, 父母代 or 苗种 in fina_mainbz", "monthly brief reports 鸡苗/仔猪 volume as the headline"]
      - id: own_resource_mining
        name: 自有资源开采
        description: Mines its own deposits; profit = market price − mining cost; value tied to reserves.
        signals: ["资源储量 and 采矿权 disclosed", "unit mining cost disclosed", "无形资产 holds 采矿权"]
      - id: mine_to_metal_integrated
        name: 采选冶一体化
        description: Own mines feed own smelters; earns both the resource rent and part of the processing spread.
        signals: ["fina_mainbz splits 矿产 and 冶炼 products", "资源自给率 disclosed", "外购原料 share < 50%"]
      - id: quota_allocated_resource
        name: 配额/指标制资源
        description: Output capped by state quotas (稀土, 钨, 制冷剂 etc.); quota holders enjoy restricted supply.
        signals: ["text mentions 开采指标 / 冶炼分离指标 / 生产配额", "quota volume disclosed"]
  A2:
    name: 加工价差
    name_en: Processing spread
    revenue_formula: "volume × (output_price − input_price)"
    drivers:
      - {role: volume, description: "加工量/销量"}
      - {role: price, description: "产品售价"}
      - {role: input_price, description: "主要原料采购价"}
      - {role: input_cost_share, description: "原材料占营业成本比例"}
      - {role: spread, description: "价差/加工费 (炼油毛利, TC/RC, 吨钢毛利)"}
      - {role: unit_margin, description: "单位毛利/净利 (吨利)"}
      - {role: utilisation, description: "开工率/产能利用率"}
      - {role: capacity, description: "设计产能"}
      - {role: mix, description: "高端品种占比, 副产品"}
      - {role: self_sufficiency, description: "上游原料自给率"}
    pricing: spread
    pass_through: partial
    profit_hinge: "spread between output and input markets times utilisation; scale and process cost decide who earns in the trough"
    cycle_signals: [margin, commodity_price, capex, inventory]
    moat_types: [cost, efficient_scale]
    valuation_methods: [PB, PE, EV_EBITDA, EV_per_capacity]
    variants:
      - id: standalone_converter
        name: 外购原料加工
        description: Buys all inputs on the market and sells into another market; earns the pure spread.
        signals: ["主要原材料 all 外购", "毛利率 tracks a published spread index", "no upstream segment in fina_mainbz"]
      - id: upstream_integrated_converter
        name: 上游一体化
        description: Owns part of its feedstock (自有煤矿, 自有浆, 自有氧化铝, 自有磷矿); cushions the spread.
        signals: ["原料自给率 disclosed", "upstream product appears as internal supply in elimination rows", "采矿权 or upstream capacity disclosed"]
      - id: toll_processing_fee
        name: 加工费模式
        description: Price = input cost passed through + a negotiated processing fee (来料加工, 正极加工费, 钢结构吨加工费).
        signals: ["经营模式 text mentions 加工费 or 成本加成 or 原材料价格+加工费", "毛利率 falls when input prices rise but 毛利额 per ton stable"]
      - id: physical_trading
        name: 大宗贸易
        description: Buys and sells physical commodities with inventory and hedging; thin margin, large revenue.
        signals: ["毛利率 < 5%", "fina_mainbz names 贸易 or 供应链 revenue", "large 衍生金融工具 / 套期保值 notes"]
  A3:
    name: B2B零部件/材料供应
    name_en: B2B component / material supplier
    revenue_formula: "shipments × ASP × mix"
    drivers:
      - {role: volume, description: "出货量/销量"}
      - {role: price, description: "ASP/单价, often with annual price-downs"}
      - {role: input_price, description: "主要原材料价格 (铜, 树脂, 钢材)"}
      - {role: mix, description: "产品/下游结构 (汽车, 服务器, 新能源占比)"}
      - {role: utilisation, description: "产能利用率/稼动率"}
      - {role: capacity, description: "产能"}
      - {role: design_wins, description: "定点/认证/客户验证进展"}
      - {role: orders, description: "新增定点/新签订单"}
      - {role: content_per_unit, description: "单车/单机配套价值量"}
    pricing: negotiated
    pass_through: lagged
    profit_hinge: "design wins and mix upgrades against customer concentration and annual price-downs"
    cycle_signals: [demand, inventory, capex, margin]
    moat_types: [switching, cost, intangible]
    valuation_methods: [PE, PEG, EV_EBITDA]
    variants:
      - id: odm_oem_maker
        name: ODM/OEM 代工
        description: Makes to the customer's specification under the customer's brand.
        signals: ["经营模式 text mentions ODM or OEM or 代工", "自有品牌 revenue share < 30%", "top-5 customers > 50%"]
      - id: own_brand_supplier
        name: 自有品牌标准品
        description: Sells its own catalogue products to many B2B buyers, often via distributors.
        signals: ["经销 share > 40% in 分销售模式", "top-5 customers < 30%", "text mentions 自有品牌 or 标准品"]
      - id: single_key_customer
        name: 单一大客户
        description: One customer (Apple, Tesla, SGCC, a car OEM) dominates; revenue rides that customer's cycle.
        signals: ["largest customer > 30% of revenue in top-5 table", "text names 大客户 or a specific customer program"]
      - id: diversified_customers
        name: 客户分散
        description: Broad customer base; no single customer above 10%.
        signals: ["top-5 customers < 25%", "largest customer < 10%"]
      - id: design_in_program
        name: 项目定点
        description: Wins multi-year supply programs per platform (定点), revenue follows the program's ramp.
        signals: ["text mentions 定点 or 项目定点 or 生命周期总金额", "new program awards announced"]
  A4:
    name: 设备/工程项目
    name_en: Equipment / project contractor
    revenue_formula: "new_orders → backlog → revenue recognised (deliveries)"
    drivers:
      - {role: orders, description: "新签订单/新签合同额/中标金额"}
      - {role: backlog, description: "在手订单/手持订单"}
      - {role: deliveries, description: "交付/发出商品/竣工 (revenue recognition)"}
      - {role: volume, description: "设备销量/施工面积"}
      - {role: price, description: "招标/新造船价格水平"}
      - {role: cash_conversion, description: "经营现金流 vs 利润"}
      - {role: leverage, description: "净负债率 (presale developers, PPP)"}
      - {role: funding_cost, description: "融资成本"}
      - {role: mix, description: "运营收入占比/业务结构"}
    pricing: bid
    pass_through: partial
    profit_hinge: "order intake and backlog cover versus margin per project and cash collection"
    cycle_signals: [demand, capex, margin]
    moat_types: [intangible, switching, efficient_scale]
    valuation_methods: [PE, PB, EV_backlog]
    variants:
      - id: equipment_vendor
        name: 设备销售
        description: Sells standardised or configured machines; revenue on delivery/acceptance.
        signals: ["发出商品 and 合同负债 large", "收入确认 on 验收 or 交付", "设备销售 dominant in fina_mainbz"]
      - id: epc_contractor
        name: 工程总承包
        description: Builds projects under EPC/总承包, revenue over time by progress.
        signals: ["合同资产 large", "收入确认 按履约进度", "text mentions EPC or 总承包 or 施工"]
      - id: ppp_investment_build
        name: 投资建设 PPP/BOT
        description: Invests in and builds projects recovered over a concession; balance-sheet heavy.
        signals: ["长期应收款 or 特许经营权 rising", "text mentions PPP or BOT or 投资类项目", "net debt rising with backlog"]
      - id: presale_developer
        name: 预售开发
        description: Sells homes before completion; contracted sales become revenue on delivery; land bank is inventory.
        signals: ["合同负债 from 预售", "存货 mostly 开发成本", "text mentions 签约销售 and 土地储备"]
      - id: defense_state_plan
        name: 军品计划订货
        description: Supplies state defense programs; price via 审价, orders via annual plans and related-party framework.
        signals: ["日常关联交易预计 large", "text mentions 军品 or 审价 or 暂定价", "实际控制人 is a defense group"]
      - id: equipment_plus_service
        name: 设备+服务
        description: Installed base drives recurring service, spares and upgrades.
        signals: ["服务/备件 revenue share > 20%", "text mentions 运维 or 后市场"]
  A5:
    name: 消费品牌
    name_en: Consumer brand
    revenue_formula: "volume × price_per_unit, by channel"
    drivers:
      - {role: volume, description: "销量 (吨, 千升, 台, 件)"}
      - {role: price, description: "吨价/单价/均价"}
      - {role: mix, description: "高端产品占比"}
      - {role: channel, description: "渠道结构 (线上, 直营, 外销)"}
      - {role: dealers, description: "经销商数量"}
      - {role: stores, description: "门店数量"}
      - {role: store_changes, description: "净增门店"}
      - {role: same_store_growth, description: "同店增长/零售流水"}
      - {role: capacity, description: "产能"}
      - {role: input_price, description: "主要原料价格 (原奶, 黄金, 浆)"}
      - {role: input_cost_share, description: "原材料成本占比"}
      - {role: unit_margin, description: "吨利/单车净利"}
      - {role: products, description: "品种/品牌数量 (审定品种)"}
      - {role: efficiency, description: "生产/经营效率"}
    pricing: brand
    pass_through: lagged
    profit_hinge: "price per unit and channel mix versus marketing spend; pricing power shows as stable 吨价 growth"
    cycle_signals: [demand, inventory, margin]
    moat_types: [intangible, cost, network]
    valuation_methods: [PE, DCF, PEG]
    variants:
      - id: direct_retail_led
        name: 直营主导
        description: Sells mostly through own stores or direct sales.
        signals: ["直营/直销 share > 50% in 分销售模式", "使用权资产 and store count large"]
      - id: distributor_led
        name: 经销主导
        description: Sells mostly to distributors who hold channel inventory.
        signals: ["经销 share > 50% in 分销售模式", "经销商数量 disclosed", "合同负债 from distributor prepayments"]
      - id: online_led
        name: 线上主导
        description: E-commerce and live-stream channels dominate.
        signals: ["线上 share > 50%", "销售费用 dominated by 平台推广费"]
      - id: franchise_led
        name: 加盟主导
        description: Franchised stores sell the brand; company earns wholesale and franchise fees.
        signals: ["加盟店 > 70% of store count", "加盟管理费 revenue line"]
      - id: brand_plus_export_oem
        name: 自有品牌+外销代工
        description: Own brand at home plus OEM/ODM exports for foreign brands.
        signals: ["外销 share > 30% with OEM/ODM text", "自有品牌 share disclosed below 70%"]
  A6:
    name: 零售/分销
    name_en: Retail / distribution
    revenue_formula: "stores × sales_per_store (or GMV × take_rate)"
    drivers:
      - {role: stores, description: "门店数量"}
      - {role: store_changes, description: "新开/关闭门店"}
      - {role: same_store_growth, description: "同店/可比店增长"}
      - {role: gmv, description: "销售总额/GMV"}
      - {role: sales_density, description: "坪效"}
      - {role: members, description: "会员数量"}
      - {role: volume, description: "业务量/销量"}
      - {role: take_rate, description: "佣金率/扣点"}
      - {role: channel, description: "线上/平台占比"}
      - {role: customers, description: "覆盖客户/医疗机构/合作品牌数"}
      - {role: mix, description: "品类结构"}
      - {role: price, description: "客单价"}
    pricing: market
    pass_through: full
    profit_hinge: "same-store growth and gross margin against rent and labour; inventory turns decide cash"
    cycle_signals: [demand, inventory, margin]
    moat_types: [cost, network, efficient_scale]
    valuation_methods: [PE, PS, EV_EBITDA]
    variants:
      - id: self_operated_retail
        name: 自营零售
        description: Buys inventory and sells it; gross revenue, inventory risk.
        signals: ["存货 / revenue > 10%", "收入按总额法", "自营 share disclosed"]
      - id: concession_leasing
        name: 联营/租赁
        description: Department-store or mall model earning commission (扣点) and rent; net revenue.
        signals: ["text mentions 联营 or 扣点", "租赁收入 large", "收入按净额法"]
      - id: platform_marketplace
        name: 平台撮合
        description: Marketplace or service provider taking a fee on GMV.
        signals: ["GMV disclosed", "佣金/服务费 revenue", "low 存货"]
      - id: wholesale_distribution
        name: 批发分销
        description: Distributes goods (药品, 汽车, 大宗) to B2B customers with thin margins and long receivables.
        signals: ["应收账款 days > 90", "毛利率 < 10%", "text mentions 分销 or 配送"]
      - id: franchise_chain
        name: 加盟连锁
        description: Store network mostly franchised; earns supply margin and fees.
        signals: ["加盟店 share > 50%", "加盟费 revenue line"]
  A7:
    name: 公用事业/基础设施
    name_en: Regulated utility / infrastructure
    revenue_formula: "capacity × utilisation_hours × regulated_tariff"
    drivers:
      - {role: capacity, description: "装机/管网/路段/泊位/处理能力"}
      - {role: volume, description: "上网电量/售气量/吞吐量/车流量"}
      - {role: utilisation, description: "利用小时/能力因子/弃风弃光"}
      - {role: tariff, description: "上网电价/水价/装卸费率"}
      - {role: unit_cost, description: "燃料单价 (入炉标煤单价)"}
      - {role: unit_margin, description: "毛差 (gas)"}
      - {role: efficiency, description: "供电煤耗/吨垃圾上网电量"}
      - {role: users, description: "用户数"}
      - {role: connections, description: "新增接驳用户"}
      - {role: network, description: "管网长度"}
      - {role: mix, description: "市场化交易占比, 国际旅客占比"}
      - {role: resource, description: "来水量/蓄水"}
      - {role: capacity_payment, description: "容量电费"}
    pricing: regulated
    pass_through: lagged
    profit_hinge: "allowed tariff and utilisation against fuel cost and financing; growth comes only from new capacity"
    cycle_signals: [commodity_price, capex, demand]
    moat_types: [efficient_scale, intangible]
    valuation_methods: [PE, PB, DCF, DDM, EV_EBITDA]
    variants:
      - id: regulated_tariff_asset
        name: 核定电价/政府定价
        description: Price fixed by a regulator (benchmark or cost-plus).
        signals: ["text mentions 核定 or 政府定价 or 标杆电价", "tariff disclosed and changes only on policy dates"]
      - id: market_traded_output
        name: 市场化交易
        description: A large share of output sold at market-traded prices.
        signals: ["市场化交易电量占比 > 50%", "text mentions 现货市场 or 中长期交易"]
      - id: concession_operator
        name: 特许经营
        description: Operates a concession (收费公路, 水务, 垃圾焚烧, 管道燃气) for a fixed term.
        signals: ["特许经营权 in 无形资产", "收费期限 or 特许经营期 disclosed"]
      - id: subsidy_dependent_renewable
        name: 补贴依赖型新能源
        description: Renewable projects whose returns depend on unpaid national subsidies.
        signals: ["可再生能源补贴应收款 large", "text mentions 国补 or 补贴目录"]
      - id: city_gas_distribution
        name: 城燃配售+接驳
        description: Buys gas at city gate, sells at regulated retail tariffs plus connection fees.
        signals: ["接驳费 revenue line", "毛差 disclosed", "text mentions 顺价"]
  A8:
    name: 流量/单位服务
    name_en: Traffic / unit service
    revenue_formula: "units_served × yield"
    drivers:
      - {role: capacity, description: "运力/客房/银幕/点位/实验室"}
      - {role: volume, description: "客运量/件量/入住/人次"}
      - {role: utilisation, description: "客座率/出租率/刊挂率/翻台率"}
      - {role: yield, description: "客公里收益/单票收入/RevPAR/客单价"}
      - {role: unit_cost, description: "单位成本 (扣油座公里成本, 单票成本)"}
      - {role: network, description: "网点/门店/机构数量"}
      - {role: stores, description: "门店数量 (restaurants, clinics)"}
      - {role: price, description: "平均价格 (ADR, 客单价)"}
    pricing: market
    pass_through: partial
    profit_hinge: "load factor and yield against a largely fixed unit cost (operating leverage)"
    cycle_signals: [demand, capex, margin]
    moat_types: [network, cost, efficient_scale]
    valuation_methods: [PE, EV_EBITDA, PB]
    variants:
      - id: asset_heavy_operator
        name: 重资产自营
        description: Owns or leases the fleet/property and operates it.
        signals: ["fixed assets + right-of-use assets / revenue > 1", "直营 share high"]
      - id: asset_light_franchise
        name: 轻资产加盟/管理输出
        description: Brand and system rented to franchisees or managed for owners.
        signals: ["加盟/管理 hotels or outlets > 50%", "特许经营费 or 加盟费 revenue line"]
      - id: direct_operated_network
        name: 直营网络
        description: Runs the whole network itself (直营快递, 自营门店) with full cost control.
        signals: ["text mentions 直营", "人工/外包成本 large share of 营业成本"]
      - id: spot_rate_exposed
        name: 即期运价敞口
        description: Revenue reprices with spot market rates (shipping, freight forwarding).
        signals: ["text mentions 即期 or 现货运价 vs 长约", "revenue moves with SCFI/BDI"]
  A9:
    name: 软件/平台/订阅
    name_en: Software / platform / subscription
    revenue_formula: "users_or_contracts × ARPU (recurring) + projects"
    drivers:
      - {role: users, description: "用户/客户/在管面积/订户数"}
      - {role: paying_users, description: "付费用户/会员"}
      - {role: arpu, description: "ARPU/ARPPU"}
      - {role: gross_billings, description: "流水"}
      - {role: recurring_share, description: "订阅/经常性收入占比"}
      - {role: pipeline, description: "储备产品/版号/合约面积"}
      - {role: customer_mix, description: "政府/金融/第三方客户占比"}
      - {role: retention, description: "续费率/退费率/收缴率"}
      - {role: staff, description: "员工/研发人员数"}
      - {role: capacity, description: "机柜/IT负载/学习中心"}
      - {role: utilisation, description: "上架率"}
    pricing: contract
    pass_through: none
    profit_hinge: "recurring share and retention against R&D and sales headcount; project work dilutes margins"
    cycle_signals: [demand, margin]
    moat_types: [switching, network, intangible]
    valuation_methods: [PE, PS, DCF, EV_users]
    variants:
      - id: product_licence
        name: 软件许可
        description: Sells perpetual licences plus maintenance.
        signals: ["软件产品 revenue line", "增值税即征即退 large", "毛利率 > 70%"]
      - id: saas_subscription
        name: SaaS/订阅
        description: Recurring subscription or cloud service.
        signals: ["text mentions 订阅 or SaaS or 云服务", "合同负债 growing faster than revenue", "ARR disclosed"]
      - id: project_delivery
        name: 定制开发/系统集成
        description: Custom projects and integration with hardware pass-through; revenue by acceptance.
        signals: ["系统集成 or 技术服务 lines dominant", "hardware share of 营业成本 > 30%", "Q4 revenue share > 40%"]
      - id: ad_supported
        name: 广告变现
        description: Free users monetised through advertising.
        signals: ["广告 revenue > 50%", "MAU disclosed without paying users"]
      - id: paid_membership_content
        name: 付费会员/内容
        description: Users pay for content or membership.
        signals: ["会员 revenue line", "付费会员数 disclosed"]
      - id: in_app_purchase
        name: 道具付费
        description: Free-to-play games monetised by in-game purchases; revenue follows 流水 with deferral.
        signals: ["游戏流水 disclosed", "递延收入/合同负债 from 道具", "渠道分成 in 营业成本"]
      - id: headcount_outsourcing
        name: 人力外包/人月计价
        description: Billing by person-month (IT outsourcing, property services staff).
        signals: ["职工薪酬 > 50% of 营业成本", "text mentions 人月 or 驻场"]
      - id: capacity_lease
        name: 容量租赁 (IDC/物业)
        description: Leases racks, power or managed area on multi-year contracts.
        signals: ["机柜数 or IT负载 or 在管面积 disclosed", "fixed assets / revenue > 1.5 (IDC)"]
  A10:
    name: 医药产品组合
    name_en: Pharma / biotech portfolio
    revenue_formula: "Σ product_sales (+ licensing / milestones)"
    drivers:
      - {role: product_sales, description: "主要产品/创新药收入"}
      - {role: approvals, description: "获批注册证/一致性评价/批签发"}
      - {role: pipeline, description: "在研项目/临床阶段项目"}
      - {role: vbp_exposure, description: "集采中标品种/中标情况"}
      - {role: licensing, description: "对外授权首付款/里程碑"}
      - {role: volume, description: "销量/采浆量"}
      - {role: price, description: "吨浆收入/单价"}
      - {role: capacity, description: "浆站/产能"}
      - {role: installed_base, description: "装机量 (instrument + reagent)"}
      - {role: mix, description: "品种数/独家品种"}
      - {role: channel, description: "市场苗 vs 政采苗, 医院 vs OTC"}
    pricing: negotiated
    pass_through: none
    profit_hinge: "pipeline success and exclusivity against VBP price cuts; sales-expense ratio shows channel cost"
    cycle_signals: [demand, margin]
    moat_types: [intangible, switching]
    valuation_methods: [PE, DCF, rNPV, SOTP, PS]
    variants:
      - id: innovative_pipeline
        name: 创新药/创新器械
        description: Revenue increasingly from patented innovative products; heavy R&D.
        signals: ["研发投入占比 > 15%", "创新药收入 disclosed", "临床项目 count disclosed"]
      - id: generic_vbp
        name: 仿制药/集采
        description: Generic portfolio sold mostly through volume-based procurement.
        signals: ["集采中标品种 disclosed", "一致性评价 counts", "销售费用率 falling"]
      - id: otc_consumer_brand
        name: OTC/品牌中药
        description: Branded OTC or TCM sold to consumers through pharmacies; behaves like A5.
        signals: ["零售/OTC channel > 40%", "销售费用率 > 30%", "text mentions 品牌 or 独家品种"]
      - id: licence_out_partnering
        name: 授权合作
        description: Earns upfronts and milestones from out-licensing.
        signals: ["对外授权首付款 or 里程碑 in revenue", "BD announcements"]
      - id: instrument_plus_reagent
        name: 仪器+试剂闭环
        description: Places instruments, earns recurring reagent/consumable revenue.
        signals: ["装机量 disclosed", "试剂 revenue > 60%", "仪器投放 in 固定资产"]
      - id: plasma_supply_constrained
        name: 浆源约束
        description: Output limited by licensed plasma stations; price set by scarcity.
        signals: ["采浆量 and 浆站数 disclosed", "text mentions 单采血浆站"]
  A11:
    name: 合同制造/服务
    name_en: Contract service (CXO, EMS/ODM, foundry)
    revenue_formula: "capacity × utilisation × price_per_unit"
    drivers:
      - {role: capacity, description: "月产能/产线/员工"}
      - {role: utilisation, description: "产能利用率/稼动率"}
      - {role: volume, description: "晶圆出货/产量"}
      - {role: price, description: "单价/ASP"}
      - {role: mix, description: "12英寸/先进封装/高端产品占比"}
      - {role: orders, description: "新签订单"}
      - {role: backlog, description: "在手订单"}
      - {role: customers, description: "活跃客户数"}
      - {role: staff, description: "研发技术人员/外包人员"}
      - {role: pipeline, description: "在研分子/项目"}
    pricing: negotiated
    pass_through: partial
    profit_hinge: "utilisation of fixed capacity and customer mix; capex timing versus demand"
    cycle_signals: [demand, capex, inventory]
    moat_types: [switching, cost, efficient_scale]
    valuation_methods: [PE, EV_EBITDA, PB]
    variants:
      - id: dedicated_capacity
        name: 专线/专属产能
        description: Capacity built for one customer or program, often customer-funded tooling.
        signals: ["largest customer > 40%", "text mentions 专线 or 客户专属 or 客户提供设备"]
      - id: shared_capacity
        name: 共享产能
        description: General capacity sold to many customers (foundry, multi-client CDMO).
        signals: ["top-5 customers < 40%", "产能利用率 disclosed as a fab/plant average"]
      - id: fte_service
        name: FTE按人头计费
        description: Billed per scientist or worker (CRO FTE, HR outsourcing).
        signals: ["text mentions FTE or 人头", "职工薪酬 > 50% of 营业成本"]
      - id: fee_for_service
        name: FFS按项目计费
        description: Billed per project or milestone delivered.
        signals: ["text mentions FFS or 里程碑", "在手订单 by project disclosed"]
      - id: cost_plus_pass_through
        name: 料件代采成本加成
        description: Assembly where components are bought and passed through; very low margin.
        signals: ["直接材料 > 70% of 营业成本", "毛利率 < 12%"]
  A12:
    name: 金融资产负债表
    name_en: Financial balance sheet
    revenue_formula: "interest_earning_assets × NIM + fees − credit_cost"
    drivers:
      - {role: assets, description: "贷款/投资资产/两融/租赁资产"}
      - {role: funding, description: "存款"}
      - {role: nim, description: "净息差/净利差"}
      - {role: asset_yield, description: "生息资产收益率"}
      - {role: funding_cost, description: "负债成本/活期占比"}
      - {role: fees, description: "手续费/承销/非息收入占比"}
      - {role: cost_income, description: "成本收入比"}
      - {role: asset_quality, description: "不良率/关注/逾期/生成率"}
      - {role: provision, description: "拨备覆盖率/拨贷比/核销"}
      - {role: credit_cost, description: "信用成本"}
      - {role: capital, description: "资本充足率/净资本/偿付能力"}
      - {role: liquidity, description: "LCR/NSFR/存贷比"}
      - {role: leverage, description: "杠杆率/杠杆倍数"}
      - {role: aum, description: "资管/零售AUM/信托规模"}
      - {role: customers, description: "客户数"}
      - {role: premiums, description: "保费"}
      - {role: nbv, description: "新业务价值"}
      - {role: embedded_value, description: "内含价值"}
      - {role: combined_ratio, description: "综合成本率/赔付率/费用率"}
      - {role: investment_yield, description: "投资收益率"}
      - {role: retention, description: "继续率"}
      - {role: distribution, description: "代理人/渠道"}
      - {role: mix, description: "零售贷款占比/业务结构"}
    pricing: market
    pass_through: lagged
    profit_hinge: "NIM (or spread / NBV margin) against credit cost and capital consumption"
    cycle_signals: [demand, margin]
    moat_types: [cost, intangible, efficient_scale, network]
    valuation_methods: [PB, PE, P_EV, DDM]
    variants:
      - id: corporate_lending_bank
        name: 对公为主银行
        description: Loan book dominated by corporate and government-linked lending.
        signals: ["零售贷款占比 < 35%", "对公存款 > 60%"]
      - id: retail_wealth_bank
        name: 零售/财富银行
        description: Retail loans and wealth management drive returns and fees.
        signals: ["零售贷款占比 > 45%", "零售AUM disclosed", "手续费 share > 15%"]
      - id: brokerage_fee_led
        name: 轻资本券商
        description: Earnings led by brokerage, underwriting and asset management fees.
        signals: ["经纪+投行+资管 > 60% of revenue", "杠杆倍数 < 3.5"]
      - id: capital_intermediary
        name: 重资本券商
        description: Earnings led by proprietary trading and margin lending.
        signals: ["自营+利息净收入 > 50% of revenue", "金融投资资产 / 净资产 > 2"]
      - id: life_insurer
        name: 寿险为主
        description: Long-duration life and health policies; value from NBV and investment spread.
        signals: ["寿险保费 > 60%", "NBV and EV disclosed"]
      - id: pc_insurer
        name: 财险为主
        description: Short-duration P&C; value from underwriting (combined ratio) plus float.
        signals: ["财险保费 > 60%", "综合成本率 disclosed"]
      - id: fee_asset_manager
        name: 管理费型
        description: Earns fees on assets managed for others (trust, AMC, futures brokers).
        signals: ["管理费/手续费 > 60% of revenue", "AUM disclosed"]
      - id: leasing_lender
        name: 融资租赁
        description: Spread lending through leases.
        signals: ["租赁资产余额 disclosed", "利息支出 large"]

# Expected signatures per archetype (D-118, BUSINESS_MODEL_DESIGN §4b.7): priors the measured company data is
# checked against. gm = FY gross-margin range; gm_vol = quarterly GM volatility vs the market (low / mid / high);
# pricing = pricing-power labels that fit; turnover = asset-turnover range; output_beta = GM follows the selling
# price (positive) or not (any). A12 (balance sheets) has no gross margin: not checked.
signatures:
  A1:  {gm: [0.05, 0.50], gm_vol: high, pricing: [taker, middle], turnover: [0.2, 1.5], output_beta: positive}
  A2:  {gm: [0.03, 0.30], gm_vol: high, pricing: [taker, middle], turnover: [0.4, 2.5], output_beta: any}
  A3:  {gm: [0.10, 0.40], gm_vol: mid,  pricing: [middle, taker], turnover: [0.4, 1.5], output_beta: any}
  A4:  {gm: [0.10, 0.45], gm_vol: mid,  pricing: [middle, maker], turnover: [0.2, 1.0], output_beta: any}
  A5:  {gm: [0.35, 0.95], gm_vol: low,  pricing: [maker, middle], turnover: [0.3, 1.5], output_beta: any}
  A6:  {gm: [0.05, 0.35], gm_vol: low,  pricing: [middle, taker], turnover: [0.8, 4.0], output_beta: any}
  A7:  {gm: [0.10, 0.60], gm_vol: low,  pricing: [middle],        turnover: [0.05, 0.5], output_beta: any}
  A8:  {gm: [0.05, 0.50], gm_vol: mid,  pricing: [middle, taker], turnover: [0.2, 1.5], output_beta: any}
  A9:  {gm: [0.30, 0.95], gm_vol: low,  pricing: [maker, middle], turnover: [0.2, 1.0], output_beta: any}
  A10: {gm: [0.30, 0.95], gm_vol: low,  pricing: [maker, middle], turnover: [0.2, 1.0], output_beta: any}
  A11: {gm: [0.10, 0.45], gm_vol: mid,  pricing: [middle, taker], turnover: [0.3, 1.5], output_beta: any}

