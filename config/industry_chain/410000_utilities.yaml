# Shenwan L1 410000 公用事业 — product taxonomy prior (plan 12 phase 1, D-097).
# Format: README.md beside this file. All edges are priors (general industry knowledge).
# Water supply lives here (SEG_UTIL_WATER) although Shenwan files water companies under 760102 (环保);
# 760000_environmental.yaml maps 760102 to it.
sector: {sw_l1: "410000", name: 公用事业, name_en: Utilities}

