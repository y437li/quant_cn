# 期货监测 (plan 15 ph7i, D-145): contract families to watch and value-chain spreads.
# Every commodity family with open interest (73; index and bond futures excluded; monthly-average
# contracts such as L_F excluded) — user: "可以改吧" (2026-11-13).
# family = "<fut_code>.<suffix>" as in fut_daily (SHF, DCE, ZCE, INE, GFE).
# Spreads are computed from each leg's most-held (dominant) contract settle, 元/吨 unless noted.
# Coefficients are industry rules of thumb (to be checked by the user, plan 15 open question):
#   PTA 加工费   = PTA − 0.655 × PX
#   甲醇制烯烃利润 = PP − 3 × 甲醇 (about 3 t methanol per t olefin; before other costs)
#   瓶片加工费   = 瓶片 − 0.855 × PTA − 0.335 × 乙二醇
#   铝 − 氧化铝 = 铝 − 1.93 × 氧化铝 (before power and anodes: not a full smelter margin)
#   螺纹 / 热卷利润 = 成材 − 1.6 × 铁矿 − 0.5 × 焦炭 (before conversion cost)
#   玻璃 − 纯碱 = 玻璃 − 纯碱 (spread, not a cost formula)
#   多晶硅 − 工业硅 = 多晶硅 − 1.2 × 工业硅
#   猪粮比 = 生猪 / 玉米 (ratio of 元/吨 prices)
#   金银比 = 1000 × 黄金 (元/克) / 白银 (元/千克); 金油比 = 31.1035 × 黄金 (元/克) / 原油 (元/桶) = barrels per ounce
#   铜金比 = 铜 (元/吨) / 黄金 (元/克) = grams of gold one ton of copper buys (same shape as $/lb ÷ $/oz)
# A ratio is (coef 1 × leg 1) / (coef 2 × leg 2).
min_oi: 1000          # a contract below this open interest is not a curve point (delivery months)
flag_low: 0.05        # percentile at or below which a curve or spread is flagged
flag_high: 0.95
oi_z: 2.0             # |z| of the 5-day open-interest change vs one year that is flagged
reversion_z: 2.0      # |z| of a reversion spread vs its one-year mean that is flagged (D-156)
# 股指期货 (plan 15 ph7k): basis of the most-held contract to its index, annualised to the
# third-Friday expiry (dividend season May-Aug deepens the discount), and top-20 broker nets.
index_futures:
