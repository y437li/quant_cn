spreads:
  - key: pta_margin
    name: PTA 加工费
    unit: 元/吨
    legs: [{family: TA.ZCE, coef: 1.0}, {family: PX.ZCE, coef: -0.655}]
    reversion: true       # out of sample since 2023: z-reversion Sharpe 1.34 (D-156)
    half_life_d: 12
  - key: mto_margin
    name: 甲醇制烯烃利润（PP − 3×甲醇）
    unit: 元/吨
    legs: [{family: PP.DCE, coef: 1.0}, {family: MA.ZCE, coef: -3.0}]
    reversion: true       # out of sample since 2023: z-reversion Sharpe 1.06 (D-156)
    half_life_d: 94
  - key: bottle_margin
    name: 瓶片加工费
    unit: 元/吨
    legs: [{family: PR.ZCE, coef: 1.0}, {family: TA.ZCE, coef: -0.855}, {family: EG.DCE, coef: -0.335}]
  - key: al_ao
    name: 铝 − 1.93×氧化铝
    unit: 元/吨
    legs: [{family: AL.SHF, coef: 1.0}, {family: AO.SHF, coef: -1.93}]
  - key: rebar_margin
    name: 螺纹利润（未扣加工）
    unit: 元/吨
    legs: [{family: RB.SHF, coef: 1.0}, {family: I.DCE, coef: -1.6}, {family: J.DCE, coef: -0.5}]
    reversion: true       # user added 2026-11-14; since 2023 Sharpe 1.1 but not stationary (D-156 update)
    half_life_d: 152
  - key: hrc_margin
    name: 热卷利润（未扣加工）
    unit: 元/吨
    legs: [{family: HC.SHF, coef: 1.0}, {family: I.DCE, coef: -1.6}, {family: J.DCE, coef: -0.5}]
    reversion: true       # user added 2026-11-14; since 2023 Sharpe 1.1 but not stationary (D-156 update)
    half_life_d: 149
  - key: glass_soda
    name: 玻璃 − 纯碱
    unit: 元/吨
    legs: [{family: FG.ZCE, coef: 1.0}, {family: SA.ZCE, coef: -1.0}]
  - key: poly_si
    name: 多晶硅 − 1.2×工业硅
    unit: 元/吨
    legs: [{family: PS.GFE, coef: 1.0}, {family: SI.GFE, coef: -1.2}]
  - key: hog_corn
    name: 猪粮比
    unit: 倍
    kind: ratio
    legs: [{family: LH.DCE, coef: 1.0}, {family: C.DCE, coef: 1.0}]
  - key: gold_silver
    name: 金银比
    unit: 倍
    kind: ratio
    legs: [{family: AU.SHF, coef: 1000.0}, {family: AG.SHF, coef: 1.0}]  # 元/克 x1000 vs 元/千克
  - key: gold_oil
    name: 金油比（桶/盎司）
    unit: 桶
    kind: ratio
    legs: [{family: AU.SHF, coef: 31.1035}, {family: SC.INE, coef: 1.0}]  # 元/盎司 vs 元/桶
  - key: copper_gold
    name: 铜金比（克金/吨铜）
    unit: 克/吨
    kind: ratio
    legs: [{family: CU.SHF, coef: 1.0}, {family: AU.SHF, coef: 1.0}]  # 元/吨 vs 元/克
