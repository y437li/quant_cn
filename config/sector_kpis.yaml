# # config/sector_kpis.yaml — sector-specific KPIs per Shenwan industry (D-106)
#
# The CompanyCard (D-104) has one uniform schema plus a `sector_kpis` block whose fields depend on the
# company's Shenwan industry. This file defines those fields. Values are extracted later (plan 12 ph4,
# rules first) and stored as rows `(ts_code, kpi_id, period, value, unit, evidence)`.
#
# ```yaml
# sectors:
#   "110000":                       # Shenwan L1 code (string)
#     name: 农林牧渔
#     kpis: [...]                   # KPIs for every company of the L1 sector (may be empty)
#     groups:                       # optional refinement by L2/L3 codes; a company gets L1 + matching groups
#       - name: 生猪养殖
#         sw: ["110702"]            # L2 or L3 codes from sw_tree.csv
#         kpis:
#           - id: hog_sales_volume  # ^[a-z][a-z0-9_]*$, unique within the whole file
#             name: 生猪销售量
#             unit: 万头
#             freq: monthly         # monthly | quarterly | semiannual | annual
#             definition: 报告期内销售的商品猪、仔猪、种猪合计头数
#             sources: [monthly_sales_brief, annual_report:capacity]
#             keywords: [销售生猪, 出栏, 万头]
#             higher_is_better: true      # optional: true | false | omit when neutral
#             origin: prior               # prior (Opus seed) until the evidence pass sets the tier
#             tier: core                  # core (broker-tracked and disclosed) | broker (tracked only) | disclosed (disclosed only)
#             report_citations: 0         # broker industry reports tracking it
#             disclosure_share: 0.0       # share of the group's companies disclosing it in filings
# ```
# Allowed `sources`: `annual_report:<section>` (sections: business, industry, revenue_mix, capacity,
# costs_materials, counterparties, competition, risks, regulatory_metrics), `semiannual_report`,
# `quarterly_report`, `monthly_sales_brief`, `operating_announcement`, `ir_record`, `irm_qa`,
# `prospectus`, `broker_report`, `tushare:<endpoint>`.
#
# Keep 4–10 KPIs per group, only figures that companies of that industry actually disclose.
#
# The KPI set is decided by broker reports and company filings together (D-106 amendment): the first
# version, written by Opus, is a seed with `origin: prior`; the evidence pass sets `tier`, `report_citations`
# and `disclosure_share`, and drops KPIs seen on neither side.

# Sector-specific KPIs per Shenwan 2021 industry (plan 12, D-106). Format: config/sector_kpis_README.md.
# Seed version written from prior knowledge (origin: prior); to be replaced/confirmed by the broker-report pass.
# A company gets the L1 `kpis` plus every group whose `sw` list contains its L2 or L3 code.
sectors:
  "110000":
    name: 农林牧渔
    kpis: []
    groups:
      - name: 生猪养殖
        sw: ["110702"]
        kpis:
          - {id: hog_sales_volume, name: 生猪销售量, unit: 万头, freq: monthly, higher_is_better: true, origin: prior, definition: 报告期内销售的商品猪、仔猪、种猪合计头数, sources: [monthly_sales_brief, "annual_report:capacity", broker_report], keywords: [销售生猪, 生猪销售量, 出栏量, 生猪出栏, 万头]}
          - {id: hog_sales_revenue, name: 生猪销售收入, unit: 亿元, freq: monthly, higher_is_better: true, origin: prior, definition: 当月销售生猪取得的销售收入, sources: [monthly_sales_brief], keywords: [销售收入, 生猪销售收入, 亿元]}
          - {id: hog_avg_price, name: 商品猪销售均价, unit: 元/公斤, freq: monthly, origin: prior, definition: 商品猪销售均价, sources: [monthly_sales_brief, broker_report], keywords: [商品猪销售均价, 销售均价, 生猪价格, 元/公斤]}
          - {id: piglet_sales_volume, name: 仔猪销售量, unit: 万头, freq: monthly, origin: prior, definition: 当月对外销售的仔猪头数, sources: [monthly_sales_brief], keywords: [仔猪, 销售仔猪, 万头]}
          - {id: hog_full_cost, name: 生猪养殖完全成本, unit: 元/公斤, freq: quarterly, higher_is_better: false, origin: prior, definition: 商品猪单位完全成本，含饲料、折旧、人工与费用, sources: [ir_record, irm_qa, broker_report], keywords: [完全成本, 养殖成本, 头均成本, 元/公斤]}
          - {id: sow_inventory, name: 能繁母猪存栏, unit: 万头, freq: quarterly, origin: prior, definition: 期末能繁母猪存栏头数, sources: [ir_record, "annual_report:capacity", broker_report], keywords: [能繁母猪, 母猪存栏, 万头]}
          - {id: hog_psy, name: PSY, unit: 头, freq: quarterly, higher_is_better: true, origin: prior, definition: 每头母猪每年提供的断奶仔猪数, sources: [ir_record, broker_report], keywords: [PSY, 断奶仔猪数, MSY]}
          - {id: hog_slaughter_volume, name: 生猪屠宰量, unit: 万头, freq: annual, origin: prior, definition: 自有屠宰场年屠宰生猪头数, sources: ["annual_report:business", broker_report], keywords: [屠宰量, 屠宰生猪, 万头]}
      - name: 肉鸡养殖
