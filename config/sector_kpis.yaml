          - {id: chick_avg_price, name: 鸡苗销售均价, unit: 元/羽, freq: monthly, origin: prior, definition: 当月鸡苗销售均价, sources: [monthly_sales_brief, broker_report], keywords: [鸡苗价格, 销售均价, 元/羽, 元/只]}
          - {id: chicken_meat_sales_volume, name: 鸡肉产品销售量, unit: 万吨, freq: monthly, higher_is_better: true, origin: prior, definition: 当月鸡肉生食及深加工产品销售量, sources: [monthly_sales_brief, broker_report], keywords: [鸡肉产品销量, 鸡肉销售量, 销售量, 万吨, 吨]}
          - {id: chicken_meat_avg_price, name: 鸡肉产品销售均价, unit: 元/吨, freq: monthly, origin: prior, definition: 当月鸡肉产品平均售价, sources: [monthly_sales_brief], keywords: [鸡肉均价, 销售均价, 元/吨, 元/公斤]}
