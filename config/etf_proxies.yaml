# National-team ETF proxy (plan 15 ph7b, D-126). Refresh with `make etf-proxy`.
# Members of an index = listed (market E) ETFs, not feeder (联接) or enhanced (增强), whose
# fund_basic.benchmark tracks 100% of the index and matches `benchmark` (first match wins, so
# 中证A500 comes before 沪深300). `reference` = the index's largest ETF; its price deflates
# positions so price moves do not read as trading.
start: "20220101"
recent_days: 20
# Per-index rhythm and the 近3月 view (ph7o): weeks summed into 近N周, sessions in the
# 近3月 percentile / range, weeks in the weekly flow matrix.
rhythm_weeks: 4
pct_window_days: 63
matrix_weeks: 14
# The ETFs the national team (汇金 / 证金) holds in size, from the 2024–2025 holder disclosures.
core: ["510300.SH", "510310.SH", "510330.SH", "159919.SZ", "510050.SH", "510500.SH",
       "512100.SH", "159845.SZ", "159915.SZ", "588000.SH", "588080.SH"]
indices:
  - {name: "中证A500", benchmark: "中证A500", reference: "563360.SH"}
  - {name: "沪深300", benchmark: "沪深300指数", reference: "510300.SH"}
  - {name: "上证50", benchmark: "^(上证50|上海证券交易所50成份)", reference: "510050.SH"}
  - {name: "中证500", benchmark: "^中证(小盘)?500", reference: "510500.SH"}
  - {name: "中证1000", benchmark: "^中证1000", reference: "512100.SH"}
  - {name: "创业板指", benchmark: "^创业板指数", reference: "159915.SZ"}
  - {name: "科创50", benchmark: "^上证科创板50成份", reference: "588000.SH"}
# Style groups watched for crowding (plan 15 ph7g): never part of the core / other totals above.
# z = 20-day net flow as % of AUM against the previous 250 sessions; 过热 at z >= 1.5 (in
# 2022-08..2026-11 the bank index returned -3.0% over the next 60 days after it, +2.7% otherwise).
styles:
  - {key: bank, name: "银行", benchmark: "^中证(800)?银行指数", reference: "512800.SH"}
  - {key: dividend, name: "红利", benchmark: "红利", exclude: "港股|恒生|港元|香港", reference: "510880.SH"}
