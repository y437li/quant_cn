  text_fields: [series, release_date]
  curated: {path: macro/release_m2}

szse_margin_targets:
  source: akshare
  endpoint: stock_margin_underlying_info_szse
  # official SZSE list of margin-eligible securities per day (flags for margin buy / short sell)
  sweep: {kind: trade_date, param_name: date, key_field: trade_date}
  start: "20190101"
  primary_key: [trade_date, code]
  known_on: trade_date
  rename: {证券代码: code, 证券简称: name, 融资标的: fin_target, 融券标的: sec_target, 当日可融资: fin_today,
           当日可融券: sec_today, 融券卖出价格限制: short_price_limit, 涨跌幅限制: limit_pct}
  fields: [trade_date, code, name, fin_target, sec_target, fin_today, sec_today, short_price_limit,
           limit_pct]
  text_fields: [trade_date, code, name, fin_target, sec_target, fin_today, sec_today,
                short_price_limit, limit_pct]
  curated: {path: szse_margin_targets, partition_by: trade_date}

# --- BaoStock: verification only (D-065, D-085); written to raw/baostock_*, never replaces Tushare ---

baostock_daily:
  source: baostock
  endpoint: query_history_k_data_plus
  # unadjusted bars per stock, full history once (about 5 s per stock); SH/SZ only
  sweep: {kind: ts_code, range_params: true, extra_params: {frequency: d, adjustflag: "3"},
          values_from_dataset: {dataset: stock_basic, column: ts_code, where: "ts_code NOT LIKE '%.BJ'"}}
  start: "20190101"
  primary_key: [ts_code, trade_date]
  known_on: trade_date
  rename: {date: trade_date}
  fields: [ts_code, trade_date, open, high, low, close, preclose, volume, amount, tradestatus]
  text_fields: [ts_code, trade_date]
  curated: {path: verification/baostock_daily, partition_by: trade_date}

baostock_daily_recent:
  source: baostock
  endpoint: query_history_k_data_plus
  # the last sessions per stock, rewritten by `make verify-prices` (force); overrides the backfill
  sweep: {kind: ts_code, range_params: true, extra_params: {frequency: d, adjustflag: "3"},
          values_from_dataset: {dataset: stock_basic, column: ts_code, where: "ts_code NOT LIKE '%.BJ'"}}
  primary_key: [ts_code, trade_date]
  known_on: trade_date
  rename: {date: trade_date}
  fields: [ts_code, trade_date, open, high, low, close, preclose, volume, amount, tradestatus]
  text_fields: [ts_code, trade_date]
  curated: {path: verification/baostock_daily_recent}

baostock_adj_factor:
  source: baostock
  endpoint: query_adjust_factor
  # factors only on dividend dates (back factor = cumulative, compared step by step with adj_factor)
  sweep: {kind: ts_code, range_params: true,
          values_from_dataset: {dataset: stock_basic, column: ts_code, where: "ts_code NOT LIKE '%.BJ'"}}
  start: "20190101"
  primary_key: [ts_code, trade_date]
  known_on: trade_date
  rename: {dividOperateDate: trade_date, foreAdjustFactor: fore_adjust_factor,
           backAdjustFactor: back_adjust_factor, adjustFactor: adjust_factor}
  fields: [ts_code, trade_date, fore_adjust_factor, back_adjust_factor, adjust_factor]
  text_fields: [ts_code, trade_date]
  curated: {path: verification/baostock_adj_factor}

# --- documents for the industry-chain graph (plan 12 phase 2, D-096, D-100) ---
# Metadata only; PDFs are fetched by DocumentDownloader into documents/. Websites, not Tushare:
# CNINFO swept per calendar day (whole market, every category); Eastmoney per month and kind.

cninfo_announcements:
  endpoint: hisAnnouncement
  source: cninfo
  # by category and month (D-111): one CNINFO query reaches ~3,000 rows, a peak day has 26k
  # announcements, so whole-day sweeps lose data; the client splits a query above the cap by date
  # halves and then by board. Categories: periodic reports, IPO prospectuses, follow-on offerings.
  sweep: {kind: date_window, window: month, value_param: category, refetch_recent: 1,
          values: [category_ndbg_szsh, category_bndbg_szsh, category_yjdbg_szsh, category_sjdbg_szsh,
                   category_sf_szsh, category_zf_szsh]}
  start: "20231101"
  primary_key: [ann_id, sec_code]
  known_on: ann_date
  known_on_rule: next_session
  fields: [ann_id, sec_code, sec_name, org_id, title, ann_time, ann_date, adjunct_url, adjunct_size,
           adjunct_type, column_id, ann_type, page_column]
  text_fields: [ann_id, sec_code, sec_name, org_id, title, ann_time, ann_date, adjunct_url,
                adjunct_type, column_id, ann_type, page_column]
  curated: {path: documents/cninfo_announcements, partition_by: ann_date}

cninfo_keyword_announcements:
  endpoint: hisAnnouncement
  source: cninfo
  # chain-relevant announcements outside the periodic categories, by title keyword and month (D-111)
  sweep: {kind: date_window, window: month, value_param: searchkey, refetch_recent: 1,
          values: [投资者关系活动记录表, 重大合同, 中标, 问询函, 重组报告书, 对外投资, 可行性研究报告]}
  start: "20231101"
  primary_key: [ann_id, sec_code]
  known_on: ann_date
  known_on_rule: next_session
  fields: [ann_id, sec_code, sec_name, org_id, title, ann_time, ann_date, adjunct_url, adjunct_size,
           adjunct_type, column_id, ann_type, page_column]
  text_fields: [ann_id, sec_code, sec_name, org_id, title, ann_time, ann_date, adjunct_url,
                adjunct_type, column_id, ann_type, page_column]
  curated: {path: documents/cninfo_keyword_announcements, partition_by: ann_date}

em_industry_reports:
  endpoint: report_list
  source: eastmoney
  sweep: {kind: date_window, window: month, extra_params: {q_type: "1"}, refetch_recent: 1}
  start: "20231101"
  primary_key: [info_code]
  known_on: publish_date
  known_on_rule: next_session
  fields: &em_fields [info_code, publish_date, title, report_kind, stock_code, stock_name, org_code,
                      org_name, researcher, industry_code, industry_name, em_industry_code, rating,
                      rating_change, attach_pages, attach_size]
  text_fields: &em_text [info_code, publish_date, title, report_kind, stock_code, stock_name,
                         org_code, org_name, researcher, industry_code, industry_name,
                         em_industry_code, rating, rating_change]
  curated: {path: documents/em_industry_reports, partition_by: publish_date}

em_stock_reports:
  endpoint: report_list
  source: eastmoney
  sweep: {kind: date_window, window: month, extra_params: {q_type: "0"}, refetch_recent: 1}
  start: "20231101"
  primary_key: [info_code]
  known_on: publish_date
  known_on_rule: next_session
  fields: *em_fields
  text_fields: *em_text
  curated: {path: documents/em_stock_reports, partition_by: publish_date}

irm_qa_sh:
  endpoint: irm_qa_sh
  # investor Q&A on the SSE e-interaction platform; one call per calendar day (Q&A on weekends too)
  sweep: {kind: trade_date, days: all}
  start: "20231101"
  primary_key: [ts_code, pub_time, q]
  key_defaults: {q: "", pub_time: ""}
  known_on: trade_date
  known_on_rule: next_session
  fields: [ts_code, name, trade_date, q, a, pub_time]
  text_fields: [ts_code, name, trade_date, q, a, pub_time]
  curated: {path: documents/irm_qa_sh, partition_by: trade_date}

irm_qa_sz:
  endpoint: irm_qa_sz
  # investor Q&A on SZSE 互动易; same rules as irm_qa_sh, plus the CSRC industry
  sweep: {kind: trade_date, days: all}
  start: "20231101"
  primary_key: [ts_code, pub_time, q]
  key_defaults: {q: "", pub_time: ""}
  known_on: trade_date
  known_on_rule: next_session
  fields: [ts_code, name, trade_date, q, a, pub_time, industry]
  text_fields: [ts_code, name, trade_date, q, a, pub_time, industry]
  curated: {path: documents/irm_qa_sz, partition_by: trade_date}

fina_mainbz_p:
  endpoint: fina_mainbz_vip
  # main-business revenue / cost / profit by product (type P), whole market per period (plan 12).
  # No announcement date: usable from period end + 120 days (annual reports are due by 30 April).
  sweep: {kind: period, extra_params: {type: P}, refetch_recent: 2}
  start: "20230101"
  primary_key: [ts_code, end_date, bz_item]
  known_on: end_date
  known_on_rule: period_end_lag
  release_lag_days: 120
  fields: [ts_code, end_date, bz_item, bz_code, bz_sales, bz_profit, bz_cost, curr_type]
  text_fields: [ts_code, end_date, bz_item, bz_code, curr_type]
  curated: {path: documents/fina_mainbz_p, partition_by: end_date}

fina_mainbz_i:
  endpoint: fina_mainbz_vip
  # the same breakdown by industry (type I)
  sweep: {kind: period, extra_params: {type: I}, refetch_recent: 2}
  start: "20230101"
  primary_key: [ts_code, end_date, bz_item]
  known_on: end_date
  known_on_rule: period_end_lag
  release_lag_days: 120
  fields: [ts_code, end_date, bz_item, bz_code, bz_sales, bz_profit, bz_cost, curr_type]
  text_fields: [ts_code, end_date, bz_item, bz_code, curr_type]
  curated: {path: documents/fina_mainbz_i, partition_by: end_date}

# --- free labels for the industry-chain graph (plan 12, D-103) ---
# Company profiles and concept-board membership: structured, no LLM. Concept boards are market
# themes (e.g. 英伟达概念, CPO, 液冷): weak signals for recall, never evidence of a relation.

stock_company:
  endpoint: stock_company
  # one call per exchange; profile text changes rarely: refetched in full on every run
  sweep: {kind: exchange, values: [SSE, SZSE, BSE]}
  refresh: overwrite
  primary_key: [ts_code]
  known_on: null
  fields: [ts_code, com_name, com_id, exchange, chairman, manager, secretary, reg_capital, setup_date,
           province, city, introduction, website, email, office, employees, main_business,
           business_scope]
  text_fields: [ts_code, com_name, com_id, exchange, chairman, manager, secretary, setup_date,
                province, city, introduction, website, email, office, main_business, business_scope]
  curated: {path: reference/stock_company}

ths_index:
  endpoint: ths_index
  # all Tonghuashun indices: type N concept, I industry, R region, S special, ST style, TH theme, BB broad
  sweep: {kind: none}
  refresh: overwrite
  primary_key: [ts_code]
  known_on: list_date
  fields: [ts_code, name, count, exchange, list_date, type]
  text_fields: [ts_code, name, exchange, list_date, type]
  curated: {path: concepts/ths_index}

ths_member:
  endpoint: ths_member
  # members of every concept, industry and theme index (one call per index); current membership
  sweep: {kind: ts_code, values_from_dataset: {dataset: ths_index, column: ts_code,
                                               where: "type IN ('N', 'I', 'TH')"}}
  refresh: overwrite
  primary_key: [ts_code, con_code]
  known_on: null
  fields: [ts_code, con_code, con_name, weight, in_date, out_date, is_new]
  text_fields: [ts_code, con_code, con_name, in_date, out_date, is_new]
  curated: {path: concepts/ths_member}

dc_index:
  endpoint: dc_index
  # Eastmoney concept / industry / region boards, one snapshot per session from the start date
  sweep: {kind: trade_date}
  start: "20261106"
  primary_key: [ts_code, trade_date]
  known_on: trade_date
  known_on_rule: next_session
  fields: [ts_code, trade_date, name, idx_type]
  text_fields: [ts_code, trade_date, name, idx_type]
  curated: {path: concepts/dc_index, partition_by: trade_date}

dc_member:
  endpoint: dc_member
  # board membership per session (about 60k rows a day, paged), so membership changes are dated
  sweep: {kind: trade_date}
  start: "20261106"
  primary_key: [trade_date, ts_code, con_code]
  known_on: trade_date
  known_on_rule: next_session
  fields: [trade_date, ts_code, con_code, name]
  text_fields: [trade_date, ts_code, con_code, name]
  curated: {path: concepts/dc_member, partition_by: trade_date}
