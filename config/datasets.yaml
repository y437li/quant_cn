macro_release_m2:
  source: akshare
  endpoint: macro_china_m2_yearly
  sweep: {kind: none}
  refresh: overwrite
  primary_key: [release_date]
  known_on: release_date
  rename: {商品: series, 日期: release_date, 今值: actual, 预测值: forecast, 前值: previous}
